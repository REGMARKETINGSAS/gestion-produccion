<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva orden | REG Marketing</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="comun.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script src="database.js"></script>
    <script src="comun.js"></script>
    <script src="formulario.js"></script>
    <style>
        .disposicion { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
        .bloque { padding: 22px; }
        .bloque + .bloque { border-top: 0; }
        .bloque__titulo { display: flex; align-items: center; gap: 12px; margin: -22px -22px 18px; padding: 13px 22px; background: var(--oscuro); color: #fff; }
        .bloque:first-child .bloque__titulo { border-radius: var(--r-lg) var(--r-lg) 0 0; }
        .bloque__titulo span { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--celeste); color: var(--oscuro); font-weight: 800; }
        .bloque__titulo h2 { font-size: 1.05rem; }
        .bloque__titulo p { color: rgba(255, 255, 255, .75); font-size: .82rem; }
        .resumen { position: sticky; top: 16px; padding: 20px; display: grid; gap: 16px; }
        .resumen__num { font-size: .8rem; color: var(--gris); font-weight: 600; }
        .resumen__num b { display: block; font-size: 2rem; color: var(--azul-700); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
        .resumen__dato { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; padding: 8px 0; border-top: 1px solid var(--borde); }
        .resumen__dato span:first-child { color: var(--gris); }
        .resumen__dato span:last-child { font-weight: 600; text-align: right; }
        .resumen__total { text-align: center; padding: 14px; border-radius: 14px; background: var(--azul-50); }
        .resumen__total b { display: block; font-size: 2.4rem; font-weight: 800; color: var(--azul-800); line-height: 1; }
        .resumen__total small { color: var(--gris); font-weight: 600; }
        .resumen__areas { display: flex; flex-wrap: wrap; gap: 6px; }
        .editando { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--ambar-50); color: #92400E; font-weight: 600; font-size: .88rem; }
        @media (max-width: 980px) {
            .disposicion { grid-template-columns: 1fr; }
            .resumen { position: static; order: 2; }
            .resumen [data-guardar], .resumen .btn--suave { display: none; }
            .resumen__datos { display: none; }
        }
        @media (max-width: 980px) {
            .pie-movil { position: sticky; bottom: 0; z-index: 5; padding: 12px; background: rgba(242, 245, 250, .92); backdrop-filter: blur(8px); margin: 0 -12px; }
        }
        @media (min-width: 981px) { .pie-movil { display: none; } }
    </style>
</head>
<body>
    <div id="cabecera"></div>

    <main class="contenido">
        <form id="ordenForm" class="disposicion" novalidate>
            <div class="tarjeta">
                <section class="bloque">
                    <div class="bloque__titulo"><span>1</span><div><h2>Cliente y entrega</h2><p>Quién hizo el pedido y para cuándo.</p></div></div>
                    <div class="rejilla rejilla--3">
                        <div class="campo">
                            <label for="numeroOrden">N.º de orden <span class="obl">*</span></label>
                            <input id="numeroOrden" required readonly placeholder="Automático">
                            <span class="ayuda" id="ayudaNumero">Se asigna solo.</span>
                        </div>
                        <div class="campo" style="grid-column:span 2">
                            <label for="cliente">Cliente <span class="obl">*</span></label>
                            <input id="cliente" required placeholder="Nombre del cliente o empresa" autocomplete="off">
                        </div>
                        <div class="campo">
                            <label for="arte">Arte / diseño <span class="obl">*</span></label>
                            <input id="arte" required placeholder="Nombre del diseño">
                        </div>
                        <div class="campo">
                            <label for="fechaPedido">Fecha del pedido <span class="obl">*</span></label>
                            <input type="date" id="fechaPedido" required>
                        </div>
                        <div class="campo">
                            <label for="fechaEntrega" style="color:var(--rojo)">Fecha de entrega <span class="obl">*</span></label>
                            <input type="date" id="fechaEntrega" required>
                        </div>
                    </div>
                </section>

                <section class="bloque">
                    <div class="bloque__titulo"><span>2</span><div><h2>Prenda, áreas y tallas</h2><p>Los campos cambian según el tipo de prenda.</p></div></div>
                    <div id="prenda"></div>
                </section>

                <div class="pie-movil"><button type="submit" class="btn btn--primario btn--grande btn--bloque" data-guardar><i class="fas fa-floppy-disk"></i> <span>Guardar orden</span></button></div>
            </div>

            <aside class="tarjeta resumen" aria-label="Resumen de la orden">
                <div id="avisoEdicion"></div>
                <div class="resumen__num">Orden<b id="rNumero">—</b></div>
                <div class="resumen__total"><b id="rTotal" class="num">0</b><small id="rUnidad">prendas</small></div>
                <div class="resumen__datos">
                    <div class="resumen__dato"><span>Cliente</span><span id="rCliente">—</span></div>
                    <div class="resumen__dato"><span>Prenda</span><span id="rPrenda">—</span></div>
                    <div class="resumen__dato"><span>Entrega</span><span id="rEntrega">—</span></div>
                </div>
                <div>
                    <div class="etiqueta" style="margin-bottom:8px">Pasa por</div>
                    <div class="resumen__areas" id="rAreas"><span class="muted" style="font-size:.85rem">Elige las áreas</span></div>
                </div>
                <button type="submit" class="btn btn--primario btn--grande btn--bloque" data-guardar><i class="fas fa-floppy-disk"></i> <span>Guardar orden</span></button>
                <a href="dashboard-jefe.html" class="btn btn--suave btn--bloque">Cancelar</a>
            </aside>
        </form>
    </main>

    <script>
        REG.exigirSesion('jefe');
        const { esc, urgencia, fechaCorta, NOMBRE_REQ, PRENDAS } = REG;
        const $ = (id) => document.getElementById(id);
        const numeroEditar = new URLSearchParams(location.search).get('editar');
        let ordenOriginal = null; // al editar: la orden tal como está en la base (estados, avance, paquete…)
        let guardando = false;

        $('cabecera').innerHTML = REG.encabezado({
            titulo: numeroEditar ? `Editar orden ${numeroEditar}` : 'Nueva orden de producción',
            subtitulo: numeroEditar ? 'Los cambios no afectan el avance que ya registraron las áreas.' : 'Completa los datos y guarda. Las áreas la verán de inmediato en sus tablets.',
            activo: 'crear',
        });

        const prenda = REG.formularioPrenda($('prenda'), { general: true, alCambiar: actualizarResumen });

        function actualizarResumen() {
            const d = prenda.leer();
            const conf = PRENDAS[d.tipoPrenda];
            $('rNumero').textContent = $('numeroOrden').value || '—';
            $('rCliente').textContent = $('cliente').value.trim() || '—';
            $('rPrenda').textContent = d.tipoPrenda || '—';
            const f = $('fechaEntrega').value;
            $('rEntrega').innerHTML = f ? `${fechaCorta(f)} <span class="chip chip--${urgencia(f).clase}">${urgencia(f).corto}</span>` : '—';
            $('rTotal').textContent = prenda.total();
            $('rUnidad').textContent = conf?.tallas === 'cantidad' ? 'unidades' : 'prendas';
            const areas = Object.entries(d.requerimientos || {}).filter(([, v]) => v).map(([k]) => k);
            $('rAreas').innerHTML = areas.length ? areas.map((a) => `<span class="chip chip--azul">${esc(NOMBRE_REQ[a])}</span>`).join('') : '<span class="muted" style="font-size:.85rem">Elige las áreas</span>';
        }
        ['cliente', 'fechaEntrega', 'numeroOrden'].forEach((id) => $(id).addEventListener('input', actualizarResumen));

        // ---------- Arranque ----------
        $('fechaPedido').value = REG.hoyISO();

        async function iniciar() {
            if (numeroEditar) {
                const orden = await window.DB.obtenerOrden(numeroEditar);
                if (orden === undefined) {
                    REG.aviso('No hay conexión para cargar la orden. Intenta de nuevo.', 'error', 6000);
                    return;
                }
                if (!orden) {
                    await REG.confirmar({ titulo: 'Orden no encontrada', texto: `La orden ${esc(numeroEditar)} no existe o ya fue eliminada.`, si: 'Volver', no: 'Cerrar', icono: 'magnifying-glass' });
                    location.href = 'dashboard-jefe.html';
                    return;
                }
                ordenOriginal = orden;
                $('numeroOrden').value = orden.numeroOrden;
                $('cliente').value = orden.cliente || '';
                $('arte').value = orden.arte || '';
                $('fechaPedido').value = orden.fechaPedido || '';
                $('fechaEntrega').value = orden.fechaEntrega || '';
                prenda.cargar(orden);
                $('ayudaNumero').textContent = 'No se puede cambiar.';
                $('avisoEdicion').innerHTML = `<div class="editando"><i class="fas fa-pen"></i> Editando. El avance de las áreas se conserva.</div>`;
                document.querySelectorAll('[data-guardar] span').forEach((s) => (s.textContent = 'Guardar cambios'));
                if (orden.paqueteId) $('avisoEdicion').innerHTML += `<div class="chip chip--rosa" style="margin-top:8px"><i class="fas fa-layer-group"></i> Parte del ${esc(orden.paqueteId)}</div>`;
            } else {
                $('fechaEntrega').min = REG.hoyISO();
                const siguiente = await window.DB.obtenerSiguienteNumeroOrden();
                if (siguiente) $('numeroOrden').value = siguiente;
                else {
                    $('numeroOrden').readOnly = false;
                    $('ayudaNumero').textContent = 'No se pudo calcular. Escríbelo.';
                }
            }
            actualizarResumen();
        }
        iniciar();

        // ---------- Guardar ----------
        function marcarError(id, mensaje) {
            const campo = $(id).closest('.campo');
            campo.classList.add('campo--error');
            $(id).focus();
            REG.aviso(mensaje, 'alerta');
            $(id).addEventListener('input', () => campo.classList.remove('campo--error'), { once: true });
        }

        async function numeroOcupado(numero) {
            const [a, h] = await Promise.all([
                supabaseClient.from('ordenes').select('numero_orden').eq('numero_orden', numero).limit(1),
                supabaseClient.from('historial_ordenes').select('numero_orden').eq('numero_orden', numero).limit(1),
            ]);
            if (a.error && h.error) return null; // sin conexión
            return (a.data?.length || 0) + (h.data?.length || 0) > 0;
        }

        function botonesGuardar(activo, texto) {
            document.querySelectorAll('[data-guardar]').forEach((b) => {
                b.disabled = !activo;
                b.innerHTML = activo ? `<i class="fas fa-floppy-disk"></i> <span>${ordenOriginal ? 'Guardar cambios' : 'Guardar orden'}</span>` : `<i class="fas fa-spinner fa-spin"></i> ${texto}`;
            });
        }

        $('ordenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (guardando) return;
            const numero = $('numeroOrden').value.trim();
            if (!numero) return marcarError('numeroOrden', 'Falta el número de orden.');
            if (!$('cliente').value.trim()) return marcarError('cliente', 'Escribe el nombre del cliente.');
            if (!$('arte').value.trim()) return marcarError('arte', 'Escribe el nombre del arte o diseño.');
            if (!$('fechaPedido').value) return marcarError('fechaPedido', 'Elige la fecha del pedido.');
            if (!$('fechaEntrega').value) return marcarError('fechaEntrega', 'Elige la fecha de entrega.');
            if (!ordenOriginal && $('fechaEntrega').value < REG.hoyISO()) return marcarError('fechaEntrega', 'La fecha de entrega ya pasó.');
            const problema = prenda.validar();
            if (problema) return REG.aviso(problema, 'alerta');

            guardando = true;
            botonesGuardar(false, 'Guardando…');

            if (!ordenOriginal) {
                const ocupado = await numeroOcupado(numero);
                if (ocupado) {
                    guardando = false;
                    botonesGuardar(true);
                    $('numeroOrden').readOnly = false;
                    $('ayudaNumero').textContent = 'Ese número ya existe. Escribe otro.';
                    return marcarError('numeroOrden', `Ya existe una orden con el número ${numero}.`);
                }
            }

            const datos = prenda.leer();
            const campos = {
                numeroOrden: numero,
                cliente: $('cliente').value.trim(),
                fechaPedido: $('fechaPedido').value,
                fechaEntrega: $('fechaEntrega').value,
                arte: $('arte').value.trim(),
                ...datos,
                descripcionPedido: ordenOriginal?.descripcionPedido || '',
            };

            let orden, resultado;
            if (ordenOriginal) {
                // Se parte de la orden real: estados, avance de cada área y paquete NO se tocan.
                orden = { ...ordenOriginal, ...campos };
                resultado = await window.DB.actualizarOrden(numero, orden);
            } else {
                orden = {
                    ...campos,
                    fechaCreacion: new Date().toISOString(),
                    estado: { corte: 'pendiente', confeccion: 'pendiente', impresion: 'pendiente', sublimacion: 'pendiente', despacho: 'pendiente' },
                };
                resultado = await window.DB.crearOrden(orden);
            }
            guardando = false;
            botonesGuardar(true);

            if (!resultado.success) {
                const reintentar = await REG.confirmar({
                    titulo: 'No se pudo guardar',
                    texto: `La orden <b>no</b> quedó guardada: ${esc(resultado.error || 'sin conexión')}.<br>Tus datos siguen en el formulario.`,
                    si: 'Reintentar', no: 'Cerrar', peligro: true, icono: 'cloud-arrow-up',
                });
                if (reintentar) $('ordenForm').requestSubmit();
                return;
            }

            terminado(numero, !!ordenOriginal);
        });

        // Al guardar: lo primero que se necesita es la orden en PDF para imprimirla y repartirla
        function terminado(numero, editada) {
            const n = encodeURIComponent(numero);
            const fondo = document.createElement('div');
            fondo.className = 'modal-fondo';
            fondo.innerHTML = `
                <div class="modal modal--chico" role="dialog" aria-modal="true" aria-labelledby="okTitulo">
                    <div class="modal__icono" style="background:var(--verde-50);color:var(--verde)"><i class="fas fa-circle-check"></i></div>
                    <h2 id="okTitulo">${editada ? `Orden ${esc(numero)} actualizada` : `Orden ${esc(numero)} creada`}</h2>
                    <p class="modal__texto">${editada ? 'Si cambiaste algo que va impreso, descarga la orden otra vez.' : 'Ya aparece en producción y en las tablets de las áreas.'}</p>
                    <div style="display:grid;gap:8px;margin-top:18px">
                        <a class="btn btn--primario btn--bloque" href="ver-orden.html?orden=${n}&pdf=1" data-ok-pdf><i class="fas fa-file-pdf"></i> Descargar PDF para imprimir</a>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                            <a class="btn btn--borde" href="${editada ? `crear-orden.html?editar=${n}` : 'crear-orden.html'}"><i class="fas fa-${editada ? 'pen' : 'plus'}"></i> ${editada ? 'Seguir editando' : 'Crear otra'}</a>
                            <a class="btn btn--borde" href="dashboard-jefe.html?nueva=${n}"><i class="fas fa-table-columns"></i> Ir a producción</a>
                        </div>
                    </div>
                </div>`;
            document.body.appendChild(fondo);
            fondo.querySelector('[data-ok-pdf]').focus();
        }
    </script>
</body>
</html>
