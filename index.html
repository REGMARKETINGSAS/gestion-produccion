<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | REG Marketing</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="comun.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script src="database.js"></script>
    <script src="comun.js"></script>
    <style>
        body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); min-height: 100vh; background: #fff; }
        .lado {
            position: relative; overflow: hidden; color: #fff;
            background: linear-gradient(150deg, var(--azul-900) 0%, var(--azul-700) 60%, var(--azul-600) 100%);
            padding: clamp(28px, 5vw, 64px); display: flex; flex-direction: column; justify-content: space-between;
        }
        .lado::before, .lado::after {
            content: ''; position: absolute; clip-path: polygon(50% 0, 100% 100%, 0 100%); pointer-events: none;
        }
        .lado::before { width: 560px; height: 520px; right: -140px; bottom: -120px; background: linear-gradient(160deg, rgba(79, 195, 247, .45), rgba(79, 195, 247, 0) 75%); }
        .lado::after { width: 260px; height: 240px; left: -60px; top: 40%; background: linear-gradient(160deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 80%); }
        .lado__logo { width: 96px; height: 96px; border-radius: 24px; background: #fff; display: grid; place-items: center; box-shadow: 0 14px 34px rgba(0, 0, 0, .2); position: relative; z-index: 1; }
        .lado__logo img { width: 74px; }
        .lado__texto { position: relative; z-index: 1; max-width: 30ch; }
        .lado__texto h1 { font-size: clamp(2rem, 4.2vw, 3.2rem); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
        .lado__texto p { margin-top: 14px; font-size: 1.05rem; color: rgba(255, 255, 255, .8); }
        .lado__pie { position: relative; z-index: 1; font-size: .85rem; color: rgba(255, 255, 255, .65); }
        .acceso { display: grid; place-items: center; padding: clamp(24px, 5vw, 56px); }
        .acceso__caja { width: 100%; max-width: 420px; }
        .acceso h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; }
        .acceso .sub { color: var(--gris); margin: 4px 0 26px; }
        .opcion {
            width: 100%; display: flex; align-items: center; gap: 16px; padding: 18px 20px; border: 0; border-radius: 16px;
            background: var(--verde); color: #fff; text-align: left; cursor: pointer;
            box-shadow: 0 10px 24px rgba(46, 125, 50, .28); transition: transform .12s, box-shadow .15s;
        }
        .opcion:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(46, 125, 50, .34); }
        .opcion__ico { width: 48px; height: 48px; border-radius: 13px; background: rgba(255, 255, 255, .2); display: grid; place-items: center; font-size: 1.3rem; flex: none; }
        .opcion b { display: block; font-size: 1.1rem; }
        .opcion small { opacity: .85; }
        .opcion .fa-arrow-right { margin-left: auto; opacity: .8; }
        .separador { display: flex; align-items: center; gap: 12px; margin: 26px 0; color: var(--gris); font-size: .82rem; font-weight: 600; }
        .separador::before, .separador::after { content: ''; flex: 1; height: 1px; background: var(--borde); }
        .clave { position: relative; }
        .clave input { padding-left: 42px; padding-right: 46px; min-height: 50px; }
        .clave > i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gris); }
        .clave button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border: 0; border-radius: 9px; background: none; color: var(--gris); cursor: pointer; }
        .clave button:hover { color: var(--azul-700); background: var(--azul-50); }
        input::-ms-reveal { display: none; }
        .error { display: none; align-items: center; gap: 8px; margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--rojo-50); color: var(--rojo); font-weight: 600; font-size: .88rem; }
        .error.ver { display: flex; animation: temblar .35s; }
        @keyframes temblar { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
        #entrar { margin-top: 14px; }
        .bienvenida { position: fixed; inset: 0; z-index: 9999; display: none; place-items: center; background: linear-gradient(150deg, var(--azul-900), var(--azul-700)); color: #fff; text-align: center; }
        .bienvenida.ver { display: grid; animation: aparecer .2s; }
        .bienvenida i { font-size: 3rem; margin-bottom: 12px; }
        .bienvenida p { font-size: 1.3rem; font-weight: 700; }
        @media (max-width: 860px) {
            body { grid-template-columns: 1fr; }
            .lado { min-height: 0; gap: 28px; padding-bottom: 40px; }
            .lado__pie { display: none; }
        }
    </style>
</head>
<body>
    <section class="lado">
        <div class="lado__logo"><img src="logo.png" alt="REG Marketing S.A.S"></div>
        <div class="lado__texto">
            <h1>Sistema de producción</h1>
            <p>Órdenes, áreas y entregas de la planta, en tiempo real desde cualquier tablet o computador.</p>
        </div>
        <p class="lado__pie">REG Marketing S.A.S · Sistema interno</p>
    </section>

    <main class="acceso">
        <div class="acceso__caja">
            <h2>¿Cómo vas a ingresar?</h2>
            <p class="sub">Elige tu tipo de acceso.</p>

            <button class="opcion" type="button" id="trabajador">
                <span class="opcion__ico"><i class="fas fa-helmet-safety"></i></span>
                <span><b>Soy trabajador</b><small>Entrar a mi área de producción</small></span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <div class="separador">o entra como administrador</div>

            <form id="formJefe" novalidate>
                <div class="campo">
                    <label for="claveJefe">Contraseña de administrador</label>
                    <div class="clave">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="claveJefe" autocomplete="current-password" placeholder="••••••••" required>
                        <button type="button" id="verClave" aria-label="Mostrar contraseña"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="error" id="error" role="alert"><i class="fas fa-circle-exclamation"></i><span id="errorTexto"></span></div>
                <button class="btn btn--primario btn--grande btn--bloque" type="submit" id="entrar">
                    <i class="fas fa-right-to-bracket"></i> Ingresar como jefe
                </button>
            </form>
        </div>
    </main>

    <div class="bienvenida" id="bienvenida"><div><i class="fas fa-circle-check"></i><p id="bienvenidaTexto">Bienvenido</p></div></div>

    <script>
        const $ = (id) => document.getElementById(id);

        function entrar(texto, destino) {
            $('bienvenidaTexto').textContent = texto;
            $('bienvenida').classList.add('ver');
            setTimeout(() => (location.href = destino), 650);
        }

        function error(texto) {
            $('errorTexto').textContent = texto;
            $('error').classList.remove('ver');
            void $('error').offsetWidth;
            $('error').classList.add('ver');
        }

        $('trabajador').addEventListener('click', () => {
            sessionStorage.setItem('trabajadorAutenticado', 'true');
            sessionStorage.removeItem('jefeAutenticado');
            entrar('Bienvenido', 'tablet-areas.html');
        });

        $('verClave').addEventListener('click', () => {
            const input = $('claveJefe');
            const ver = input.type === 'password';
            input.type = ver ? 'text' : 'password';
            $('verClave').innerHTML = `<i class="fas fa-eye${ver ? '-slash' : ''}"></i>`;
            $('verClave').setAttribute('aria-label', ver ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });

        $('formJefe').addEventListener('submit', async (e) => {
            e.preventDefault();
            const clave = $('claveJefe').value;
            if (!clave) return error('Escribe la contraseña.');
            const boton = $('entrar');
            boton.disabled = true;
            boton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando…';
            let valido = false;
            try {
                valido = await window.DB.verificarLogin(clave);
            } catch (err) {
                boton.disabled = false;
                boton.innerHTML = '<i class="fas fa-right-to-bracket"></i> Ingresar como jefe';
                return error('No hay conexión con el servidor. Revisa el internet e intenta de nuevo.');
            }
            boton.disabled = false;
            boton.innerHTML = '<i class="fas fa-right-to-bracket"></i> Ingresar como jefe';
            if (valido) {
                sessionStorage.setItem('jefeAutenticado', 'true');
                entrar('Bienvenido, jefe', 'inicio.html');
            } else {
                $('claveJefe').value = '';
                $('claveJefe').focus();
                error('Contraseña incorrecta. Inténtalo de nuevo.');
            }
        });
    </script>
</body>
</html>
