<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áreas de trabajo | REG Marketing</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="comun.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script src="database.js"></script>
    <script src="comun.js"></script>
    <style>
        body { font-size: 16px; }
        /* ---- Selector de área ---- */
        .selector { min-height: 100vh; background: linear-gradient(150deg, var(--azul-900), var(--azul-700) 60%, var(--azul-600)); color: #fff; padding: 24px clamp(14px, 4vw, 40px) 40px; }
        .selector__cab { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
        .selector__cab .marca__logo { width: 52px; height: 52px; }
        .selector__cab .marca__logo img { width: 40px; height: 40px; }
        .selector__cab h1 { font-size: 1.15rem; font-weight: 700; }
        .selector__cab p { font-size: .85rem; opacity: .75; }
        .selector__cab .acciones { margin-left: auto; display: flex; gap: 8px; }
        .selector__titulo { max-width: 1100px; margin: 36px auto 22px; }
        .selector__titulo h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -.02em; }
        .selector__titulo p { opacity: .8; font-size: 1.05rem; }
        .areas { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
        .area-btn {
            display: grid; gap: 10px; align-content: start; text-align: left; padding: 20px; min-height: 168px;
            border: 0; border-radius: 20px; background: #fff; color: var(--tinta); cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .18); transition: transform .12s, box-shadow .15s;
        }
        .area-btn:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(0, 0, 0, .24); }
        .area-btn__ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-size: 1.45rem; }
        .area-btn b { font-size: 1.25rem; }
        .area-btn small { color: var(--gris); font-size: .88rem; }
        .area-btn__n { display: flex; gap: 6px; flex-wrap: wrap; }
        @media (max-width: 900px) { .areas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 600px) { .t-ocultable { display: none; } .acciones .btn { padding-inline: 12px; } }

        /* ---- Vista del área ---- */
        .area-barra { position: sticky; top: 0; z-index: 20; color: #fff; box-shadow: 0 4px 18px rgba(0, 0, 0, .15); }
        .area-barra__fila { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 12px clamp(12px, 3vw, 28px); flex-wrap: wrap; }
        .area-barra__ico { width: 48px; height: 48px; border-radius: 14px; background: rgba(255, 255, 255, .2); display: grid; place-items: center; font-size: 1.3rem; }
        .area-barra h1 { font-size: 1.35rem; font-weight: 800; line-height: 1.1; }
        .area-barra p { font-size: .85rem; opacity: .85; display: flex; align-items: center; gap: 6px; }
        .area-barra .acciones { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
        .filtros { max-width: 1240px; margin: 0 auto; display: flex; gap: 8px; align-items: center; padding: 0 clamp(12px, 3vw, 28px) 12px; flex-wrap: wrap; }
        .filtro { border: 0; padding: 8px 14px; border-radius: 999px; background: rgba(255, 255, 255, .16); color: #fff; font-weight: 600; cursor: pointer; font-size: .9rem; }
        .filtro[aria-pressed="true"] { background: #fff; color: var(--tinta); }
        .buscar { margin-left: auto; position: relative; }
        .buscar input { height: 40px; width: min(280px, 60vw); border: 0; border-radius: 999px; padding: 0 16px 0 38px; font-size: .95rem; }
        .buscar i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gris); }
        .lista { max-width: 1240px; margin: 18px auto 60px; padding: 0 clamp(10px, 3vw, 28px); display: grid; gap: 16px; }

        .orden { overflow: hidden; border-left: 6px solid var(--azul-700); }
        .orden--vencida { border-left-color: var(--rojo); }
        .orden--hoy { border-left-color: #FF6D00; }
        .orden--pronto { border-left-color: var(--ambar); }
        .orden__cab { display: flex; gap: 16px; padding: 18px 20px; align-items: flex-start; }
        .orden__img { width: 104px; height: 104px; border-radius: 16px; object-fit: cover; background: #F0F4F8; border: 1px solid var(--borde); cursor: zoom-in; flex: none; }
        .orden__img--vacia { display: grid; place-items: center; color: var(--borde-2); font-size: 2.2rem; cursor: default; }
        .orden__num { font-size: 1.9rem; font-weight: 800; line-height: 1; color: var(--azul-700); letter-spacing: -.02em; }
        .orden__cliente { font-size: 1.15rem; font-weight: 700; margin-top: 4px; }
        .orden__prenda { color: var(--gris); }
        .orden__chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .orden__chips .chip { font-size: .85rem; padding: 5px 12px; }
        .orden__ver { margin-left: auto; flex: none; }
        .orden__cuerpo { padding: 0 20px 20px; display: grid; gap: 16px; }
        .fichas { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
        .ficha { padding: 10px 14px; border-radius: 12px; background: #F6F8FB; border: 1px solid var(--borde); }
        .ficha small { display: block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--gris); }
        .ficha b { font-size: 1.02rem; overflow-wrap: anywhere; }
        .obs { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #FFF8E1; border: 1.5px solid #FFD54F; }
        .obs i { color: var(--ambar); margin-top: 3px; }
        .logos-fila { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
        .logo-mini { flex: none; width: 110px; text-align: center; }
        .logo-mini small { display: block; font-size: .68rem; font-weight: 700; text-transform: uppercase; color: var(--naranja); margin-bottom: 4px; }
        .logo-mini img { width: 110px; height: 80px; object-fit: contain; border-radius: 10px; border: 1px solid var(--borde); background: #fff; cursor: zoom-in; padding: 4px; }

        .tallas-av { display: grid; grid-template-columns: repeat(auto-fill, minmax(184px, 1fr)); gap: 10px; }
        .tav { padding: 12px; border-radius: 14px; border: 1.5px solid var(--borde); background: #fff; display: grid; gap: 8px; }
        .tav.parcial { border-color: #FFCC80; background: #FFFBF3; }
        .tav.lista { border-color: #A5D6A7; background: #F4FBF4; }
        .tav__cab { display: flex; justify-content: space-between; align-items: baseline; }
        .tav__cab b { font-size: 1.15rem; }
        .tav__cab span { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .tav__cab span small { color: var(--gris); font-weight: 500; }
        .tav__btns { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 6px; }
        .tav__btns button { height: 42px; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; background: var(--azul-100); color: var(--azul-800); font-size: .95rem; }
        .tav__btns button:hover { background: #CFE3FA; }
        .tav__btns button.todo { background: var(--verde); color: #fff; }
        .tav__btns button:disabled { opacity: .5; cursor: wait; }
        .tav__ok { color: var(--verde); font-weight: 700; text-align: center; }
        .grupo-titulo { font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
        .total-av { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 16px; border-radius: 14px; background: #F6F8FB; }
        .total-av b { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .total-av .controles { display: flex; gap: 8px; align-items: center; }
        .total-av input { width: 90px; height: 48px; border: 1.5px solid var(--borde-2); border-radius: 12px; text-align: center; font-size: 1.1rem; font-weight: 700; }
        .orden__pie { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 20px; border-top: 1px solid var(--borde); background: #FAFBFD; }
        .orden__pie .pasos { flex: 1; min-width: 260px; }

        .paquete { border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sombra); }
        .paquete__cab { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 20px; border: 0; background: linear-gradient(135deg, #880E4F, var(--rosa)); color: #fff; cursor: pointer; text-align: left; }
        .paquete__cab b { font-size: 1.1rem; }
        .paquete__cab small { opacity: .85; display: block; }
        .paquete__cab .chip { background: rgba(255, 255, 255, .2); color: #fff; }
        .paquete__cab .fa-chevron-down { margin-left: auto; transition: transform .2s; }
        .paquete.abierto .paquete__cab .fa-chevron-down { transform: rotate(180deg); }
        .paquete__cuerpo { display: none; background: #FBF2F6; padding: 12px; gap: 12px; }
        .paquete.abierto .paquete__cuerpo { display: grid; }
        .paquete .orden { border-left-color: var(--rosa); }

        .subir-arriba { position: fixed; right: 18px; bottom: 18px; z-index: 30; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--tinta); color: #fff; box-shadow: var(--sombra-alta); cursor: pointer; display: none; }
        @media (max-width: 640px) {
            .orden__cab { flex-wrap: wrap; }
            .orden__img { width: 84px; height: 84px; }
            .orden__ver { margin-left: 0; width: 100%; }
            .buscar { margin-left: 0; width: 100%; }
            .buscar input { width: 100%; }
            .total-av { grid-template-columns: 1fr; text-align: center; }
            .total-av .controles { justify-content: center; }
        }
    </style>
</head>
<body>
    <section class="selector" id="selector">
        <div class="selector__cab">
            <span class="marca__logo"><img src="logo.png" alt=""></span>
            <div><h1>REG Marketing</h1><p>Producción por áreas</p></div>
            <div class="acciones">
                <a href="inicio.html" class="btn btn--claro oculto" id="btnPrincipal"><i class="fas fa-house"></i><span class="t-ocultable"> Sistema principal</span></a>
                <button class="btn btn--claro" data-cerrar-sesion><i class="fas fa-right-from-bracket"></i><span class="t-ocultable"> Salir</span></button>
            </div>
        </div>
        <div class="selector__titulo">
            <h2>¿En qué área trabajas hoy?</h2>
            <p>Toca tu área para ver las órdenes que te tocan.</p>
        </div>
        <div class="areas" id="areas"></div>
    </section>

    <section id="vista" class="oculto">
        <header class="area-barra" id="areaBarra">
            <div class="area-barra__fila">
                <span class="area-barra__ico"><i id="areaIco" class="fas fa-cut"></i></span>
                <div><h1 id="areaNombre">Área</h1><p id="areaEstado"><i class="fas fa-circle" style="font-size:.5rem"></i> Conectado</p></div>
                <div class="acciones">
                    <button class="btn btn--claro" id="btnCambiar"><i class="fas fa-arrows-rotate"></i> Cambiar área</button>
                    <button class="btn btn--claro" data-cerrar-sesion><i class="fas fa-right-from-bracket"></i> Salir</button>
                </div>
            </div>
            <div class="filtros">
                <button class="filtro" data-filtro="todas" aria-pressed="true">Todas <span id="nTodas"></span></button>
                <button class="filtro" data-filtro="pendiente" aria-pressed="false">Por iniciar <span id="nPendiente"></span></button>
                <button class="filtro" data-filtro="en-proceso" aria-pressed="false">En proceso <span id="nProceso"></span></button>
                <label class="buscar"><i class="fas fa-magnifying-glass"></i><input type="search" id="buscar" placeholder="Buscar orden o cliente"></label>
            </div>
        </header>
        <div class="lista" id="lista"></div>
    </section>

    <button class="subir-arriba" id="subirArriba" aria-label="Volver arriba"><i class="fas fa-arrow-up"></i></button>

    <script>
        const sesion = REG.exigirSesion('cualquiera');
        const { esc, AREAS, ORDEN_AREAS, urgencia, fechaCorta, totalOrden, gruposConCantidad, areasDe, estadoArea, valorCampo, ETIQUETA_CAMPO } = REG;
        const $ = (id) => document.getElementById(id);
        if (sesion.jefe) $('btnPrincipal').classList.remove('oculto');

        let area = null;
        let ordenes = [];
        let filtro = 'todas';
        let ocupado = false; // mientras se guarda algo no se refresca la lista
        const paquetesAbiertos = new Set();

        // ---------- Selector ----------
        function pintarSelector() {
            $('areas').innerHTML = ORDEN_AREAS.map((a) => {
                const info = AREAS[a];
                const mias = ordenes.filter((o) => o.requerimientos?.[a] && estadoArea(o, a) !== 'completado');
                const proceso = mias.filter((o) => estadoArea(o, a) === 'en-proceso').length;
                const vencidas = mias.filter((o) => urgencia(o.fechaEntrega).clase === 'vencida').length;
                return `<button class="area-btn" data-area="${a}">
                    <span class="area-btn__ico" style="background:${info.color}"><i class="fas fa-${info.icono}"></i></span>
                    <span><b>${esc(info.nombre)}</b><br><small>${esc(info.sub)}</small></span>
                    <span class="area-btn__n">
                        <span class="chip chip--azul">${mias.length} por hacer</span>
                        ${proceso ? `<span class="chip chip--pronto">${proceso} en proceso</span>` : ''}
                        ${vencidas ? `<span class="chip chip--vencida">${vencidas} ${vencidas === 1 ? "vencida" : "vencidas"}</span>` : ''}
                    </span>
                </button>`;
            }).join('');
        }
        $('areas').addEventListener('click', (e) => {
            const b = e.target.closest('[data-area]');
            if (b) abrirArea(b.dataset.area);
        });

        function abrirArea(a) {
            area = a;
            const info = AREAS[a];
            localStorage.setItem('areaSeleccionada', a);
            history.replaceState(null, '', `?area=${a}`);
            $('selector').classList.add('oculto');
            $('vista').classList.remove('oculto');
            $('areaBarra').style.background = `linear-gradient(135deg, ${info.color}, ${info.color}dd)`;
            $('areaIco').className = `fas fa-${info.icono}`;
            $('areaNombre').textContent = info.largo;
            document.title = `${info.nombre} | REG Marketing`;
            window.scrollTo(0, 0);
            pintarLista();
        }
        $('btnCambiar').addEventListener('click', () => {
            area = null;
            localStorage.removeItem('areaSeleccionada');
            history.replaceState(null, '', location.pathname);
            $('vista').classList.add('oculto');
            $('selector').classList.remove('oculto');
            document.title = 'Áreas de trabajo | REG Marketing';
            pintarSelector();
        });

        // ---------- Lista del área ----------
        const delArea = () => ordenes.filter((o) => {
            if (o.requerimientos && !o.requerimientos[area]) return false;
            return estadoArea(o, area) !== 'completado';
        });

        function pintarLista() {
            if (!area) return;
            const todas = delArea().sort((a, b) => urgencia(a.fechaEntrega).dias - urgencia(b.fechaEntrega).dias);
            $('nTodas').textContent = todas.length;
            $('nPendiente').textContent = todas.filter((o) => estadoArea(o, area) === 'pendiente').length;
            $('nProceso').textContent = todas.filter((o) => estadoArea(o, area) === 'en-proceso').length;
            const q = $('buscar').value.trim().toLowerCase();
            const visibles = todas.filter((o) => (filtro === 'todas' || estadoArea(o, area) === filtro) && (!q || `${o.numeroOrden} ${o.cliente} ${o.tipoPrenda} ${o.paqueteId || ''}`.toLowerCase().includes(q)));

            if (!todas.length) {
                $('lista').innerHTML = `<div class="tarjeta vacio"><i class="fas fa-circle-check" style="color:var(--verde-2)"></i><h3>¡Todo al día!</h3><p>No hay órdenes pendientes en ${esc(AREAS[area].nombre)}.</p></div>`;
                return;
            }
            if (!visibles.length) {
                $('lista').innerHTML = `<div class="tarjeta vacio"><i class="fas fa-filter"></i><h3>Nada con ese filtro</h3></div>`;
                return;
            }
            // Paquetes agrupados, ubicados según su entrega más próxima
            const bloques = [];
            const paquetes = {};
            visibles.forEach((o) => {
                if (o.paqueteId) {
                    if (!paquetes[o.paqueteId]) { paquetes[o.paqueteId] = []; bloques.push({ paquete: o.paqueteId }); }
                    paquetes[o.paqueteId].push(o);
                } else bloques.push({ orden: o });
            });
            $('lista').innerHTML = bloques.map((b) => (b.orden ? tarjeta(b.orden) : paquete(b.paquete, paquetes[b.paquete]))).join('');
        }

        function paquete(id, lista) {
            const u = urgencia(lista.reduce((m, o) => (o.fechaEntrega < m ? o.fechaEntrega : m), lista[0].fechaEntrega));
            const unidades = lista.reduce((s, o) => s + totalOrden(o), 0);
            return `<div class="paquete ${paquetesAbiertos.has(id) ? 'abierto' : ''}" data-paquete="${esc(id)}">
                <button class="paquete__cab" data-abrir-paquete="${esc(id)}">
                    <i class="fas fa-layer-group" style="font-size:1.4rem"></i>
                    <span><b>${esc(id)} · ${esc(lista[0].cliente)}</b><small>${lista.map((o) => esc(o.tipoPrenda)).join(' · ')}</small></span>
                    <span class="chip">${lista.length} prendas · ${unidades} uds</span>
                    <span class="chip chip--${u.clase}">${esc(u.corto)}</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="paquete__cuerpo">${lista.map(tarjeta).join('')}</div>
            </div>`;
        }

        function fichas(o) {
            const campos = AREAS[area].campos.filter((c) => o[c]);
            return campos.length ? `<div class="fichas">${campos.map((c) => `<div class="ficha"><small>${esc(ETIQUETA_CAMPO[c])}</small><b>${esc(valorCampo(c, o[c]))}</b></div>`).join('')}</div>` : '';
        }

        function logos(o) {
            const lista = [['imagenMangaDerecha', 'Manga der.'], ['imagenMangaIzquierda', 'Manga izq.'], ['imagenFrente', 'Frente'], ['imagenEspalda', 'Espalda']]
                .filter(([k]) => o[k]).map(([k, t]) => [o[k], t])
                .concat((o.imagenesAdicionales || []).filter(Boolean).map((u, i) => [u, `Logo ${i + 1}`]));
            if (!lista.length) return '';
            return `<div><div class="grupo-titulo" style="color:var(--naranja)"><i class="fas fa-layer-group"></i> Logos del diseño</div>
                <div class="logos-fila">${lista.map(([u, t]) => `<div class="logo-mini"><small>${esc(t)}</small><img src="${esc(u)}" alt="${esc(t)}" data-ver-imagen="${esc(u)}" data-titulo="${esc(t)}" loading="lazy"></div>`).join('')}</div></div>`;
        }

        function avance(o, enProceso) {
            const progreso = o[`progreso_${area}`] || {};
            const n = esc(o.numeroOrden);
            if (o.cantidadTotal) {
                const hechas = Math.min(parseInt(progreso.total) || 0, o.cantidadTotal);
                const faltan = o.cantidadTotal - hechas;
                return `<div class="total-av">
                    <div><div class="grupo-titulo" style="color:var(--gris);margin:0">Unidades</div><b>${hechas}<small class="muted" style="font-size:1.2rem">/${o.cantidadTotal}</small></b></div>
                    <div class="barra-avance ${faltan === 0 ? 'lista' : ''}"><span style="width:${(hechas / o.cantidadTotal) * 100}%"></span></div>
                    ${enProceso && faltan > 0 ? `<div class="controles">
                        <input type="number" inputmode="numeric" min="1" max="${faltan}" value="1" id="cant-${n}" aria-label="Unidades terminadas">
                        <button class="btn btn--primario btn--grande" data-sumar-total="${n}" data-max="${faltan}"><i class="fas fa-plus"></i> Agregar</button>
                    </div>` : faltan === 0 ? '<span class="tav__ok"><i class="fas fa-check-circle"></i> Completas</span>' : ''}
                </div>`;
            }
            return gruposConCantidad(o).map((g) => `
                <div><div class="grupo-titulo" style="color:${g.color}">${esc(g.titulo)}</div>
                <div class="tallas-av">${g.tallas.map((t) => {
                    const hechas = Math.min(parseInt(progreso[t.clave]) || 0, t.cantidad);
                    const faltan = t.cantidad - hechas;
                    const clase = faltan === 0 ? 'lista' : hechas > 0 ? 'parcial' : '';
                    return `<div class="tav ${clase}">
                        <div class="tav__cab"><b>${esc(t.etiqueta)}</b><span>${hechas}<small>/${t.cantidad}</small></span></div>
                        <div class="barra-avance ${faltan === 0 ? 'lista' : ''}"><span style="width:${(hechas / t.cantidad) * 100}%"></span></div>
                        ${enProceso && faltan > 0 ? `<div class="tav__btns">
                            <button data-sumar="${n}" data-talla="${esc(t.clave)}" data-n="1" data-max="${faltan}" aria-label="Sumar 1 a ${esc(t.etiqueta)}">+1</button>
                            <button data-sumar="${n}" data-talla="${esc(t.clave)}" data-n="${Math.min(5, faltan)}" data-max="${faltan}" aria-label="Sumar ${Math.min(5, faltan)} a ${esc(t.etiqueta)}">+${Math.min(5, faltan)}</button>
                            <button class="todo" data-sumar="${n}" data-talla="${esc(t.clave)}" data-n="${faltan}" data-max="${faltan}" aria-label="Completar ${esc(t.etiqueta)}">Todas</button>
                        </div>` : faltan === 0 ? '<div class="tav__ok"><i class="fas fa-check"></i> Lista</div>' : ''}
                    </div>`;
                }).join('')}</div></div>`).join('');
        }

        function pasos(o) {
            return `<div class="pasos">${areasDe(o).map((a) => {
                const e = estadoArea(o, a);
                return `<div class="paso ${e}"><span class="paso__ico"><i class="fas fa-${e === 'completado' ? 'check' : e === 'en-proceso' ? 'spinner fa-spin' : AREAS[a].icono}"></i></span><span class="paso__nom">${esc(AREAS[a].nombre)}</span></div>`;
            }).join('')}</div>`;
        }

        function tarjeta(o) {
            const estado = estadoArea(o, area);
            const u = urgencia(o.fechaEntrega);
            const total = totalOrden(o);
            const n = esc(o.numeroOrden);
            return `<article class="tarjeta orden orden--${u.clase}" data-orden="${n}">
                <div class="orden__cab">
                    ${o.imagenDiseno ? `<img class="orden__img" src="${esc(o.imagenDiseno)}" alt="Diseño" data-ver-imagen="${esc(o.imagenDiseno)}" data-titulo="Orden ${n}" loading="lazy">` : '<div class="orden__img orden__img--vacia"><i class="fas fa-shirt"></i></div>'}
                    <div style="min-width:0">
                        <div class="orden__num">${n}</div>
                        <div class="orden__cliente">${esc(o.cliente)}</div>
                        <div class="orden__prenda">${esc(o.tipoPrenda)}${o.arte ? ` · ${esc(o.arte)}` : ''}</div>
                        <div class="orden__chips">
                            <span class="chip chip--${u.clase}"><i class="fas fa-calendar"></i> ${fechaCorta(o.fechaEntrega)} · ${esc(u.corto)}</span>
                            <span class="chip chip--azul"><i class="fas fa-boxes-stacked"></i> ${total} ${o.cantidadTotal ? 'unidades' : 'prendas'}</span>
                            <span class="chip ${estado === 'en-proceso' ? 'chip--pronto' : ''}"><i class="fas fa-${estado === 'en-proceso' ? 'spinner fa-spin' : 'clock'}"></i> ${estado === 'en-proceso' ? 'En proceso' : 'Por iniciar'}</span>
                        </div>
                    </div>
                    <a class="btn btn--borde orden__ver" href="ver-orden.html?orden=${encodeURIComponent(o.numeroOrden)}&origen=tablet&area=${encodeURIComponent(area)}"><i class="fas fa-file-lines"></i> Ver orden</a>
                </div>
                <div class="orden__cuerpo">
                    ${fichas(o)}
                    ${o.observaciones ? `<div class="obs"><i class="fas fa-triangle-exclamation"></i><div><b style="font-size:.78rem;color:var(--naranja)">OBSERVACIONES</b><div>${esc(o.observaciones)}</div></div></div>` : ''}
                    ${logos(o)}
                    ${avance(o, estado === 'en-proceso')}
                </div>
                <div class="orden__pie">
                    ${pasos(o)}
                    ${estado === 'pendiente'
                        ? `<button class="btn btn--primario btn--grande" data-iniciar="${n}"><i class="fas fa-play"></i> Iniciar trabajo</button>`
                        : `<button class="btn btn--exito btn--grande" data-completar="${n}"><i class="fas fa-check-double"></i> Terminar en ${esc(AREAS[area].nombre)}</button>`}
                </div>
            </article>`;
        }

        // ---------- Acciones (siempre esperan la respuesta de la base) ----------
        const buscarOrden = (n) => ordenes.find((o) => o.numeroOrden === n);
        function guardarLocal() { localStorage.setItem('ordenes', JSON.stringify(ordenes)); }

        async function conBoton(boton, texto, accion) {
            if (ocupado) return;
            ocupado = true;
            const antes = boton.innerHTML;
            document.querySelectorAll('#lista button').forEach((b) => (b.disabled = true));
            boton.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${texto}`;
            try { await accion(); } finally {
                ocupado = false;
                pintarLista();
            }
        }

        async function iniciar(n, boton) {
            await conBoton(boton, 'Iniciando…', async () => {
                const r = await window.DB.actualizarEstadoArea(n, area, 'en-proceso');
                if (!r.success) return REG.aviso('No se pudo iniciar. Revisa el internet e intenta de nuevo.', 'error', 5000);
                const o = buscarOrden(n);
                o.estado = { ...o.estado, [area]: 'en-proceso' };
                guardarLocal();
                REG.aviso(`Orden ${n} iniciada`, 'info');
            });
        }

        async function sumar(n, clave, cantidad, maximo, boton) {
            if (!(cantidad > 0) || cantidad > maximo) return REG.aviso(`Cantidad no válida. Máximo ${maximo}.`, 'alerta');
            const o = buscarOrden(n);
            const tope = clave === 'total' ? o.cantidadTotal : parseInt(o.tallas?.[clave]) || 0;
            await conBoton(boton, '', async () => {
                const r = await window.DB.registrarAvance(n, area, { [clave]: cantidad }, { [clave]: tope });
                if (!r.success) return REG.aviso('No se guardó el avance. Revisa el internet e intenta de nuevo.', 'error', 5000);
                o[`progreso_${area}`] = r.progreso;
                o.estado = { ...o.estado, [area]: r.estado || 'en-proceso' };
                guardarLocal();
                const etiqueta = clave === 'total' ? 'unidades' : `talla ${REG.GRUPOS_TALLAS && clave.includes('-') ? clave.split('-').pop() : clave}`;
                REG.aviso(`+${cantidad} ${etiqueta} · orden ${n}`, 'ok', 2200);
            });
        }

        async function completar(n, boton) {
            const o = buscarOrden(n);
            const ok = await REG.confirmar({
                titulo: `¿Terminar la orden ${n} en ${AREAS[area].nombre}?`,
                texto: 'Se marcan como hechas todas las prendas que falten y la orden pasa a la siguiente área.',
                si: 'Sí, terminar', icono: 'check-double',
            });
            if (!ok) return;
            const progreso = { ...(o[`progreso_${area}`] || {}) };
            if (o.cantidadTotal) progreso.total = o.cantidadTotal;
            else Object.entries(o.tallas || {}).forEach(([t, c]) => { if (c > 0) progreso[t] = c; });
            await conBoton(boton, 'Guardando…', async () => {
                const r = await window.DB.completarArea(n, area, progreso);
                if (!r.success) return REG.aviso('No se pudo terminar. Revisa el internet e intenta de nuevo.', 'error', 5000);
                o.estado = { ...o.estado, [area]: 'completado' };
                o[`progreso_${area}`] = progreso;
                guardarLocal();
                REG.aviso(`Orden ${n} terminada en ${AREAS[area].nombre}`, 'ok');
            });
        }

        $('lista').addEventListener('click', (e) => {
            const b = e.target.closest('button');
            if (!b || b.disabled) return;
            if (b.dataset.iniciar) iniciar(b.dataset.iniciar, b);
            else if (b.dataset.completar) completar(b.dataset.completar, b);
            else if (b.dataset.sumar) sumar(b.dataset.sumar, b.dataset.talla, parseInt(b.dataset.n), parseInt(b.dataset.max), b);
            else if (b.dataset.sumarTotal) {
                const n = b.dataset.sumarTotal;
                sumar(n, 'total', parseInt(document.getElementById(`cant-${n}`).value), parseInt(b.dataset.max), b);
            } else if (b.dataset.abrirPaquete) {
                const id = b.dataset.abrirPaquete;
                const caja = b.closest('.paquete');
                caja.classList.toggle('abierto');
                if (caja.classList.contains('abierto')) paquetesAbiertos.add(id); else paquetesAbiertos.delete(id);
            }
        });

        document.querySelectorAll('[data-filtro]').forEach((b) => b.addEventListener('click', () => {
            filtro = b.dataset.filtro;
            document.querySelectorAll('[data-filtro]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
            pintarLista();
        }));
        $('buscar').addEventListener('input', pintarLista);

        // ---------- Datos ----------
        function estadoConexion(ok) {
            $('areaEstado').innerHTML = ok
                ? `<i class="fas fa-circle" style="font-size:.5rem;color:#B9F6CA"></i> Actualizado ${new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}`
                : `<i class="fas fa-circle" style="font-size:.5rem;color:#FF8A80"></i> Sin conexión · se muestran los últimos datos`;
        }

        async function cargar(primera = false) {
            if (ocupado) return;
            const nuevas = await window.DB.obtenerOrdenesONull();
            if (nuevas === null) {
                estadoConexion(false);
                if (primera) { ordenes = JSON.parse(localStorage.getItem('ordenes') || '[]'); area ? pintarLista() : pintarSelector(); }
                return;
            }
            estadoConexion(true);
            const cambio = JSON.stringify(nuevas) !== JSON.stringify(ordenes);
            ordenes = nuevas;
            guardarLocal();
            if (!cambio && !primera) return;
            // No redibujar mientras alguien escribe una cantidad
            if (document.activeElement && document.activeElement.closest('#lista input')) return;
            if (area) pintarLista(); else pintarSelector();
        }

        // Lo último que se vio, mientras llega lo de la base
        ordenes = JSON.parse(localStorage.getItem('ordenes') || '[]');
        const areaURL = new URLSearchParams(location.search).get('area');
        if (areaURL && AREAS[areaURL]) abrirArea(areaURL); else pintarSelector();
        cargar(true);
        setInterval(() => cargar(), 10000);

        window.addEventListener('scroll', () => ($('subirArriba').style.display = scrollY > 400 ? 'block' : 'none'));
        $('subirArriba').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    </script>
</body>
</html>
