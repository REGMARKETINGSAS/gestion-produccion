<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción | REG Marketing</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="comun.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script src="database.js"></script>
    <script src="comun.js"></script>
    <script src="formulario.js"></script>
    <script src="reporte-pdf.js"></script>
    <script src="graficas.js"></script>
    <style>
        .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
        .kpi { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 2px solid transparent; cursor: pointer; text-align: left; transition: border-color .15s, transform .12s; }
        .kpi:hover { transform: translateY(-1px); }
        .kpi[aria-pressed="true"] { border-color: var(--azul-700); }
        .kpi__ico { width: 46px; height: 46px; flex: none; border-radius: 13px; display: grid; place-items: center; font-size: 1.15rem; }
        .kpi__num { font-size: 1.9rem; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
        .kpi small { color: var(--gris); font-weight: 600; font-size: .82rem; }
        .herram { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; margin: 16px 0; }
        .herram .buscar { position: relative; flex: 1; min-width: 220px; }
        .herram .buscar input { width: 100%; height: 42px; border: 1.5px solid var(--borde-2); border-radius: 11px; padding: 0 14px 0 40px; }
        .herram .buscar i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gris); }
        .herram select { height: 42px; border: 1.5px solid var(--borde-2); border-radius: 11px; padding: 0 12px; background: #fff; }
        .actualizado { font-size: .8rem; color: var(--gris); display: flex; align-items: center; gap: 6px; }
        .seccion { margin-bottom: 18px; }
        .seccion__cab { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border: 0; border-radius: 14px; color: #fff; cursor: pointer; text-align: left; font-weight: 700; font-size: 1rem; }
        .seccion__cab .n { background: rgba(255, 255, 255, .22); border-radius: 999px; padding: 2px 10px; font-size: .82rem; }
        .seccion__cab .fa-chevron-down { margin-left: auto; transition: transform .2s; }
        .seccion.cerrada .seccion__cab .fa-chevron-down { transform: rotate(-90deg); }
        .seccion.cerrada .seccion__lista { display: none; }
        .seccion__lista { display: grid; gap: 10px; margin-top: 10px; }
        .s-listas .seccion__cab { background: linear-gradient(135deg, #1B5E20, var(--verde-2)); }
        .s-vencidas .seccion__cab { background: linear-gradient(135deg, #8E1B1B, var(--rojo)); }
        .s-prioridad .seccion__cab { background: linear-gradient(135deg, #C2410C, #F97316); }
        .s-tiempo .seccion__cab { background: linear-gradient(135deg, var(--azul-900), var(--azul-700)); }
        .fila { display: grid; grid-template-columns: auto minmax(0, 1.25fr) minmax(0, 1.5fr) auto; gap: 16px; align-items: center; padding: 14px 16px; border-left: 5px solid var(--azul-700); }
        .fila--vencida { border-left-color: var(--rojo); }
        .fila--hoy { border-left-color: #FF6D00; }
        .fila--pronto { border-left-color: var(--ambar); }
        .fila--lista { border-left-color: var(--verde-2); }
        .fila__num { font-size: 1.3rem; font-weight: 800; color: var(--azul-700); line-height: 1.1; }
        .fila__cliente { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fila__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .fila__avance { display: grid; gap: 6px; }
        .fila__avance-txt { font-size: .78rem; color: var(--gris); font-weight: 600; display: flex; justify-content: space-between; }
        .fila__acciones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .fila .pasos .paso { min-width: 52px; }
        .fila .paso__ico { width: 28px; height: 28px; font-size: .7rem; border-width: 2px; }
        .fila .paso + .paso::before { top: 13px; }
        .fila .paso__nom { font-size: .64rem; }
        .paquete { border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sombra); background: #FBF2F6; }
        .paquete__cab { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: linear-gradient(135deg, #880E4F, var(--rosa)); color: #fff; cursor: pointer; flex-wrap: wrap; }
        .paquete__cab b { font-size: 1.05rem; }
        .paquete__cab small { display: block; opacity: .85; }
        .paquete__cab .chip { background: rgba(255, 255, 255, .2); color: #fff; }
        .paquete__cab .der { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .paquete__cab .fa-chevron-down { transition: transform .2s; }
        .paquete.abierto .paquete__cab .fa-chevron-down { transform: rotate(180deg); }
        .paquete__cuerpo { display: none; padding: 10px; gap: 10px; }
        .paquete.abierto .paquete__cuerpo { display: grid; }
        .paquete .fila { border-left-color: var(--rosa); }
        @media (max-width: 1100px) {
            .fila { grid-template-columns: auto minmax(0, 1fr); }
            .fila__avance, .fila__acciones { grid-column: 1 / -1; }
            .fila__acciones { justify-content: flex-start; }
        }
        @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi__num { font-size: 1.5rem; } }

        /* Historial */
        .hist-item { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--borde); }
        .hist-item:first-child { border-top: 0; }
        .hist-item .mini { width: 56px; height: 56px; }
        /* Paquete */
        .prenda-pkg { border: 1.5px solid #F1C6D8; border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
        .prenda-pkg__cab { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--rosa-50); color: var(--rosa); font-weight: 700; }
        .prenda-pkg__cuerpo { padding: 16px; }

        /* ¿Cómo vamos? */
        .g-sec { margin: 18px 0 4px; }
        .g-sec__cab { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .g-sec__cab h2 { font-size: 1.15rem; font-weight: 800; color: var(--tinta); }
        .g-sec__cab small { color: var(--gris); font-weight: 500; }
        .g-sec__cab .btn { margin-left: auto; }
        .g-sec.cerrada .g-cuerpo { display: none; }
        .g-rejilla { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
        .g-tarjeta { grid-column: span 2; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
        .g-tarjeta.g-ancha { grid-column: span 4; }
        .g-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .g-cab h3 { font-size: .98rem; font-weight: 700; display: flex; gap: 8px; align-items: center; }
        .g-cab h3 i { color: var(--azul-700); font-size: .9rem; }
        .g-cab__sub { font-size: .8rem; color: var(--gris); }
        .g-cab__sub b { color: var(--tinta); font-size: .95rem; }
        .g-avance { display: flex; align-items: center; gap: 18px; }
        .g-dona { width: 128px; height: 128px; flex: none; }
        .g-dona__num { font: 800 26px var(--fuente); fill: var(--tinta); letter-spacing: -.5px; }
        .g-dona__txt { font: 600 11px var(--fuente); fill: var(--gris); }
        .g-datos { list-style: none; display: grid; gap: 10px; min-width: 0; }
        .g-datos li { display: grid; line-height: 1.15; }
        .g-datos b { font-size: 1.35rem; font-weight: 800; color: var(--azul-800); }
        .g-datos span { font-size: .8rem; color: var(--gris); }
        .g-nota { font-size: .76rem; color: var(--gris-2); margin-top: auto; }
        .g-apilada { display: flex; height: 18px; border-radius: 999px; overflow: hidden; gap: 3px; background: #EDF2F7; }
        .g-apilada span { min-width: 6px; }
        .g-estados { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
        .g-estados div { display: grid; grid-template-columns: 10px auto 1fr; align-items: center; gap: 8px; }
        .g-estados i { width: 10px; height: 10px; border-radius: 3px; }
        .g-estados b { font-size: 1.3rem; font-weight: 800; }
        .g-estados span { font-size: .82rem; color: var(--gris); }
        .g-alerta, .g-ok { font-size: .84rem; font-weight: 600; padding: 9px 12px; border-radius: 10px; margin-top: auto; }
        .g-alerta { background: var(--rojo-50); color: var(--rojo); }
        .g-ok { background: var(--verde-50); color: var(--verde); }
        .g-dif { font-size: .82rem; font-weight: 700; color: var(--gris); display: inline-flex; gap: 6px; align-items: center; }
        .g-dif.sube { color: var(--verde); }
        .g-dif.baja { color: var(--rojo); }
        .g-col { width: 100%; height: auto; display: block; }
        .g-col .g-guia { stroke: #EDF2F7; stroke-dasharray: 3 4; }
        .g-col .g-valor { font: 700 11px var(--fuente); fill: var(--tinta-2); }
        .g-col .g-eje { font: 600 11px var(--fuente); fill: var(--gris); }
        .g-col .g-eje--sub { font-weight: 500; font-size: 9.5px; fill: var(--gris-2); }
        .g-col .g-destacar { fill: var(--azul-50); }
        .g-desliza { overflow-x: auto; }
        .g-desliza .g-col { min-width: 520px; }
        .g-barras { display: grid; gap: 9px; }
        .g-barra { display: grid; grid-template-columns: minmax(92px, 44%) 1fr auto; align-items: center; gap: 10px; font-size: .86rem; }
        .g-barra__nom { display: flex; gap: 7px; align-items: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .g-barra__nom i { width: 16px; text-align: center; font-size: .82rem; }
        .g-barra__pista { display: flex; height: 12px; border-radius: 999px; background: #EDF2F7; overflow: hidden; }
        .g-barra__pista span { height: 100%; }
        .g-barra__dato { text-align: right; white-space: nowrap; }
        .g-barra__dato b { font-weight: 800; }
        .g-barra__dato small { color: var(--gris); font-size: .74rem; margin-left: 4px; }
        .g-leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: .76rem; color: var(--gris); }
        .g-leyenda span { display: inline-flex; gap: 6px; align-items: center; }
        .g-leyenda i { width: 10px; height: 10px; border-radius: 3px; }
        .g-vacio { color: var(--gris); font-size: .88rem; padding: 18px 0; text-align: center; }
        @media (max-width: 1100px) { .g-rejilla { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-tarjeta { grid-column: span 1; } .g-tarjeta.g-ancha { grid-column: 1 / -1; } }
        @media (max-width: 760px) { #gFecha { display: none; } .g-rejilla { grid-template-columns: 1fr; } .g-tarjeta, .g-tarjeta.g-ancha { grid-column: auto; } .g-avance { gap: 12px; } .g-dona { width: 108px; height: 108px; } }

        .pestanas { display: flex; gap: 6px; align-items: center; margin: 18px 0 14px; padding: 5px; background: #fff; border-radius: 14px; box-shadow: var(--sombra); width: fit-content; max-width: 100%; }
        .pestanas button { border: 1.5px solid transparent; background: #EEF2F8; font: 700 .92rem var(--fuente); color: var(--gris); padding: 9px 16px; border-radius: 10px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
        .pestanas button:hover { border-color: var(--azul-700); color: var(--azul-800); }
        .pestanas button[aria-selected="true"] { background: var(--azul-700); color: #fff; border-color: var(--azul-700); }
        .pestanas small { color: var(--gris); padding: 0 10px; }
        .recientes { margin-bottom: 16px; background: #fff; border-radius: var(--r-lg); box-shadow: var(--sombra); overflow: hidden; }
        .recientes__cab { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; background: var(--oscuro); color: #fff; padding: 12px 18px; }
        .recientes__cab h2 { font-size: 1rem; font-weight: 800; display: flex; gap: 8px; align-items: center; }
        .recientes__cab h2 i { color: var(--celeste); }
        .recientes__cab small { color: rgba(255,255,255,.75); }
        .recientes__lista { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; padding: 14px; background: #F3F6FB; }
        .reciente { position: relative; background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(16,42,84,.1); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; border: 2px solid transparent; }
        .reciente--nueva { border-color: var(--verde-2); background: #F6FBF6; }
        .reciente__marca { position: absolute; top: -9px; right: 10px; background: var(--verde-2); color: #fff; font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
        .reciente__num { font-size: 1.2rem; font-weight: 800; color: var(--azul-700); line-height: 1.1; }
        .reciente__cli { font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reciente__meta { font-size: .74rem; color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reciente__acc { display: flex; gap: 6px; margin-top: 8px; }
        .reciente__acc .btn { flex: 1; justify-content: center; padding-inline: 6px; }
        @media (max-width: 1200px) { .recientes__lista { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 760px) {
            .recientes__lista { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding: 16px 14px 12px; }
            .reciente { flex: 0 0 72%; scroll-snap-align: start; }
            .pestanas { width: 100%; } .pestanas button { flex: 1; justify-content: center; padding: 9px 8px; } .pestanas small { display: none; }
        }

        .herram { flex-wrap: wrap; }
        .filtros { flex-basis: 100%; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 6px; }
        .filtros__txt { font-size: .8rem; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: .05em; margin-right: 2px; }
        .filtro { --c: var(--azul-700); --f: var(--azul-100); border: 2px solid var(--c); background: var(--f); color: var(--c); font: 700 .88rem var(--fuente); padding: 6px 7px 6px 12px; border-radius: 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; transition: transform .12s, box-shadow .15s, background .15s; }
        .filtro b { background: var(--c); color: #fff; border-radius: 8px; padding: 2px 9px; font-size: .82rem; min-width: 28px; text-align: center; }
        .filtro:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(10, 30, 70, .16); }
        .filtro:disabled { opacity: .4; cursor: default; filter: grayscale(.6); }
        .filtro[aria-pressed="true"] { background: var(--c); color: #fff; box-shadow: 0 6px 16px rgba(10, 30, 70, .22); }
        .filtro[aria-pressed="true"] b { background: #fff; color: var(--c); }
        .filtro--todas { --c: #0D47A1; --f: #E3F0FD; }
        .filtro--vencidas { --c: #C62828; --f: #FFEBEE; }
        .filtro--hoy { --c: #D84315; --f: #FBE9E7; }
        .filtro--semana { --c: #B45309; --f: #FFF4E0; }
        .filtro--proceso { --c: #00695C; --f: #E0F2F1; }
        .filtro--pendiente { --c: #455A64; --f: #ECEFF1; }
        .filtro--listas { --c: #2E7D32; --f: #E8F5E9; }
        .aviso-listas { display: flex; align-items: center; gap: 12px; background: var(--verde-50); color: var(--verde); border: 1.5px solid #C8E6C9; border-radius: 14px; padding: 10px 14px; margin: -4px 0 14px; font-size: .9rem; }
        .aviso-listas[hidden] { display: none; }
        .aviso-listas > i { font-size: 1.1rem; }
        .aviso-listas span { flex: 1; color: var(--tinta-2); }
        .conteo { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .86rem; color: var(--gris); margin: 0 4px 10px; min-height: 30px; }
        .conteo b { color: var(--tinta); }
        .grupo { margin-bottom: 22px; }
        .grupo__titulo { display: flex; align-items: center; gap: 9px; font-size: .82rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--tinta-2); margin: 0 4px 10px; }
        .grupo__titulo small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--gris); font-size: .8rem; }
        .grupo__titulo::after { content: ''; flex: 1; height: 1px; background: var(--borde-2); }
        .grupo__punto { width: 10px; height: 10px; border-radius: 50%; background: var(--azul-700); flex: none; }
        .grupo__n { background: #fff; color: var(--tinta); border: 1px solid var(--borde-2); border-radius: 999px; padding: 0 8px; font-size: .76rem; letter-spacing: 0; }
        .grupo--vencidas .grupo__punto { background: var(--rojo); } .grupo--vencidas .grupo__titulo { color: var(--rojo); }
        .grupo--hoy .grupo__punto { background: #FF6D00; } .grupo--hoy .grupo__titulo { color: #E65100; }
        .grupo--manana .grupo__punto, .grupo--semana .grupo__punto { background: var(--ambar); }
        .grupo--listas .grupo__punto { background: var(--verde-2); } .grupo--listas .grupo__titulo { color: var(--verde); }
        .grupo__lista { display: grid; gap: 10px; }
        .fila__abrir { color: inherit; text-decoration: none; display: block; min-width: 0; border-radius: 8px; }
        .fila__abrir:hover .fila__num { text-decoration: underline; }
        .fila__abrir .fila__cliente { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (max-width: 760px) {
            .filtros { flex-wrap: nowrap; overflow-x: auto; margin: 0 -14px; padding: 4px 14px 2px; }
            .filtro { flex: none; }
            .aviso-listas { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div id="cabecera"></div>

    <main class="contenido">
        <nav class="pestanas" role="tablist" aria-label="Vista del panel">
            <button role="tab" id="tabOrdenes" data-tab="ordenes"><i class="fas fa-list-check"></i> Órdenes</button>
            <button role="tab" id="tabGraficas" data-tab="graficas"><i class="fas fa-chart-pie"></i> ¿Cómo vamos?</button>
            <small id="gFecha"></small>
        </nav>

        <section class="g-sec" id="gSec" role="tabpanel" aria-labelledby="tabGraficas" hidden>
            <div class="g-cuerpo" id="graficas"><div class="cargando"><span></span><span></span><span></span></div></div>
        </section>

        <section id="panelOrdenes" role="tabpanel" aria-labelledby="tabOrdenes">
        <div id="recientes"></div>

        <div class="tarjeta herram">
            <label class="buscar"><i class="fas fa-magnifying-glass"></i><input type="search" id="buscar" placeholder="Buscar por número, cliente, prenda o paquete"></label>
            <select id="filtroArea" aria-label="Filtrar por área">
                <option value="">Todas las áreas</option>
            </select>
            <span class="actualizado" id="actualizado"></span>
            <div class="filtros" id="filtros" role="group" aria-label="Qué órdenes ver"></div>
        </div>
        <div class="aviso-listas" id="avisoListas" hidden></div>
        <div class="conteo" id="conteo"></div>

        <div id="lista"><div class="cargando"><span></span><span></span><span></span></div></div>
        </section>
    </main>

    <script>
        REG.exigirSesion('jefe');
        const { esc, AREAS, ORDEN_AREAS, urgencia, fechaCorta, totalOrden, resumenOrden, areasDe, estadoArea } = REG;
        const $ = (id) => document.getElementById(id);

        $('cabecera').innerHTML = REG.encabezado({
            titulo: 'Producción',
            subtitulo: 'Todas las órdenes activas y en qué área va cada una.',
            activo: 'dashboard',
            acciones: `
                <button class="btn btn--claro" id="btnHistorial"><i class="fas fa-clock-rotate-left"></i> Historial</button>
                <button class="btn btn--rosa" id="btnPaquete"><i class="fas fa-layer-group"></i> Nuevo paquete</button>
                <a class="btn btn--blanco" href="crear-orden.html"><i class="fas fa-plus"></i> Nueva orden</a>`,
        });
        $('filtroArea').innerHTML += ORDEN_AREAS.map((a) => `<option value="${a}">${esc(AREAS[a].nombre)}</option>`).join('');
        { const areaURL = new URLSearchParams(location.search).get('area'); if (areaURL && AREAS[areaURL]) $('filtroArea').value = areaURL; }

        let ordenes = [];
        // '', vencidas, hoy, semana, proceso, pendiente, listas · se puede llegar con ?filtro=… desde Inicio
        let filtro = new URLSearchParams(location.search).get('filtro') || '';
        const paquetesCerrados = new Set();    // los paquetes se ven abiertos; el jefe puede plegarlos

        // ---------- Pintar ----------
        // Qué cuenta en cada filtro (una orden "lista" ya no está vencida ni pendiente de entregar)
        const FILTROS = [
            ['', 'Todas', 'list', () => true],
            ['vencidas', 'Vencidas', 'circle-exclamation', (x) => x.r.estado !== 'lista' && x.u.dias < 0],
            ['hoy', 'Hoy', 'calendar-day', (x) => x.r.estado !== 'lista' && x.u.dias === 0],
            ['semana', 'Esta semana', 'calendar-week', (x) => x.r.estado !== 'lista' && x.u.dias >= 0 && x.u.dias <= 7],
            ['proceso', 'En proceso', 'gears', (x) => x.r.estado === 'proceso'],
            ['pendiente', 'Sin empezar', 'hourglass-start', (x) => x.r.estado === 'pendiente'],
            ['listas', 'Listas', 'circle-check', (x) => x.r.estado === 'lista'],
        ];
        function pintarFiltros(res) {
            $('filtros').innerHTML = '<span class="filtros__txt">Ver:</span>' + FILTROS.map(([id, txt, ico, f]) => {
                const n = res.filter(f).length;
                return `<button class="filtro filtro--${id || 'todas'}" data-filtro="${id}" aria-pressed="${filtro === id}"${n || id === filtro || !id ? '' : ' disabled'}><i class="fas fa-${ico}"></i> ${txt} <b>${n}</b></button>`;
            }).join('');
            const listas = res.filter(FILTROS.find((f) => f[0] === 'listas')[3]).length;
            $('avisoListas').hidden = !listas || filtro !== '';
            $('avisoListas').innerHTML = `<i class="fas fa-circle-check"></i><span>${listas === 1 ? 'Hay <b>1 orden terminada</b> en todas sus áreas' : `Hay <b>${listas} órdenes terminadas</b> en todas sus áreas`}. Pásala${listas === 1 ? '' : 's'} al historial para que salga${listas === 1 ? '' : 'n'} de producción.</span><button class="btn btn--exito btn--chico" data-filtro="listas">Ver ${listas === 1 ? 'cuál es' : 'cuáles son'}</button>`;
        }

        function pasosMini(o) {
            return `<div class="pasos">${areasDe(o).map((a) => {
                const e = estadoArea(o, a);
                return `<div class="paso ${e}" title="${esc(AREAS[a].nombre)}: ${e === 'en-proceso' ? 'en proceso' : e}"><span class="paso__ico"><i class="fas fa-${e === 'completado' ? 'check' : AREAS[a].icono}"></i></span><span class="paso__nom">${esc(AREAS[a].nombre)}</span></div>`;
            }).join('')}${o.requerimientos?.bordado ? `<div class="paso paso--bordado" title="Requiere bordado"><span class="paso__ico"><i class="fas fa-ring"></i></span><span class="paso__nom">Bordado</span></div>` : ''}</div>`;
        }

        function fila(o) {
            const u = urgencia(o.fechaEntrega);
            const r = resumenOrden(o);
            const n = esc(o.numeroOrden);
            const clase = r.estado === 'lista' ? 'lista' : u.clase;
            return `<article class="tarjeta fila fila--${clase}">
                ${o.imagenDiseno ? `<img class="mini" src="${esc(o.imagenDiseno)}" alt="Diseño" data-ver-imagen="${esc(o.imagenDiseno)}" data-titulo="Orden ${n}" loading="lazy">` : '<div class="mini mini--vacia"><i class="fas fa-shirt"></i></div>'}
                <div style="min-width:0">
                    <a class="fila__abrir" href="ver-orden.html?orden=${encodeURIComponent(o.numeroOrden)}" title="Ver la orden ${n}">
                        <div class="fila__num">${n}</div>
                        <div class="fila__cliente">${esc(o.cliente)}</div>
                    </a>
                    <div class="fila__meta">
                        <span class="chip chip--${u.clase}"><i class="fas fa-calendar"></i> ${fechaCorta(o.fechaEntrega)} · ${esc(u.corto)}</span>
                        <span class="chip">${esc(o.tipoPrenda)} · ${totalOrden(o)} uds</span>
                        ${o.tela ? `<span class="chip">${esc(REG.valorCampo('tela', o.tela))}</span>` : ''}
                    </div>
                </div>
                <div class="fila__avance">
                    <div class="fila__avance-txt"><span>${r.estado === 'lista' ? 'Todas las áreas listas' : `${r.hechas} de ${r.total} áreas`}</span><span>${r.pct}%</span></div>
                    ${pasosMini(o)}
                </div>
                <div class="fila__acciones">
                    ${r.estado === 'lista' ? `<button class="btn btn--exito btn--chico" data-historial="${n}"><i class="fas fa-box-archive"></i> Al historial</button>` : ''}
                    <a class="btn btn--borde btn--chico" href="ver-orden.html?orden=${encodeURIComponent(o.numeroOrden)}&pdf=1" title="Descargar la orden en PDF para imprimir" style="background:#FFEBEE;border-color:#EF9A9A;color:#B71C1C"><i class="fas fa-file-pdf"></i> PDF</a>
                    <a class="btn btn--borde btn--chico" href="ver-orden.html?orden=${encodeURIComponent(o.numeroOrden)}"><i class="fas fa-eye"></i> Ver</a>
                    <a class="btn btn--borde btn--chico" href="crear-orden.html?editar=${encodeURIComponent(o.numeroOrden)}"><i class="fas fa-pen"></i> Editar</a>
                    <button class="btn btn--suave btn--chico btn--icono" data-eliminar="${n}" title="Eliminar" aria-label="Eliminar orden ${n}"><i class="fas fa-trash" style="color:var(--rojo)"></i></button>
                </div>
            </article>`;
        }

        function bloquePaquete(id, lista) {
            const u = urgencia(lista.reduce((m, o) => (o.fechaEntrega < m ? o.fechaEntrega : m), lista[0].fechaEntrega));
            const listas = lista.every((o) => resumenOrden(o).estado === 'lista');
            const hechas = lista.filter((o) => resumenOrden(o).estado === 'lista').length;
            return `<div class="paquete ${paquetesCerrados.has(id) ? '' : 'abierto'}">
                <div class="paquete__cab" data-abrir-paquete="${esc(id)}">
                    <i class="fas fa-layer-group" style="font-size:1.3rem"></i>
                    <span><b>${esc(id)}${lista[0].arte ? ` · ${esc(lista[0].arte)}` : ''}</b><small>${esc(lista[0].cliente)} · ${lista.map((o) => esc(o.tipoPrenda)).join(' · ')}</small></span>
                    <span class="der">
                        <span class="chip">${hechas}/${lista.length} listas · ${lista.reduce((s, o) => s + totalOrden(o), 0)} uds</span>
                        <span class="chip" style="background:#fff;color:${u.clase === 'vencida' ? '#C62828' : '#9D174D'}"><i class="fas fa-calendar-day"></i> ${esc(u.corto)}</span>
                        ${listas ? `<button class="btn btn--exito btn--chico" data-historial-paquete="${esc(id)}"><i class="fas fa-box-archive"></i> Paquete al historial</button>` : ''}
                        <i class="fas fa-chevron-down"></i>
                    </span>
                </div>
                <div class="paquete__cuerpo">${lista.map(fila).join('')}</div>
            </div>`;
        }

        // Las últimas órdenes creadas, a la mano para descargar e imprimir sin buscarlas
        function pintarRecientes() {
            const ult = ordenes.slice(0, 6);   // la base las entrega de la más nueva a la más vieja
            if (!ult.length) { $('recientes').innerHTML = ''; return; }
            const nueva = new URLSearchParams(location.search).get('nueva');
            $('recientes').innerHTML = `<div class="recientes">
                <div class="recientes__cab"><h2><i class="fas fa-clock"></i> Últimas creadas</h2><small>Descárgalas para imprimir sin tener que buscarlas</small></div>
                <div class="recientes__lista">${ult.map((o) => {
                    const n = encodeURIComponent(o.numeroOrden);
                    return `<article class="reciente ${o.numeroOrden === nueva ? 'reciente--nueva' : ''}">
                        ${o.numeroOrden === nueva ? '<span class="reciente__marca">Recién creada</span>' : ''}
                        <div class="reciente__num">${esc(o.numeroOrden)}</div>
                        <div class="reciente__cli" title="${esc(o.cliente)}">${esc(o.cliente)}</div>
                        <div class="reciente__meta">${esc(o.tipoPrenda)} · ${totalOrden(o)} uds · entrega ${fechaCorta(o.fechaEntrega)}</div>
                        <div class="reciente__acc">
                            <a class="btn btn--primario btn--chico" href="ver-orden.html?orden=${n}&pdf=1"><i class="fas fa-file-pdf"></i> PDF</a>
                            <a class="btn btn--borde btn--chico" href="ver-orden.html?orden=${n}"><i class="fas fa-eye"></i> Ver</a>
                        </div>
                    </article>`;
                }).join('')}</div>
            </div>`;
        }

        function pintar() {
            const q = $('buscar').value.trim().toLowerCase();
            const areaF = $('filtroArea').value;
            const res = ordenes.map((o) => ({ o, r: resumenOrden(o), u: urgencia(o.fechaEntrega) }));
            pintarFiltros(res);
            pintarRecientes();
            pintarGraficas();

            let vis = res.filter(({ o }) => !q || `${o.numeroOrden} ${o.cliente} ${o.tipoPrenda} ${o.arte || ''} ${o.paqueteId || ''}`.toLowerCase().includes(q));
            if (areaF) vis = vis.filter(({ o }) => o.requerimientos?.[areaF] && estadoArea(o, areaF) !== 'completado');
            const fFiltro = (FILTROS.find((f) => f[0] === filtro) || FILTROS[0])[3];
            vis = vis.filter(fFiltro);

            const hayFiltro = q || areaF || filtro;
            $('conteo').innerHTML = ordenes.length ? `<span>${hayFiltro ? `Mostrando <b>${vis.length}</b> de ${ordenes.length} órdenes` : `<b>${ordenes.length}</b> órdenes activas, de la entrega más cercana a la más lejana`}</span>${hayFiltro ? '<button class="btn btn--suave btn--chico" data-limpiar><i class="fas fa-xmark"></i> Ver todas</button>' : ''}` : '';

            if (!ordenes.length) {
                $('lista').innerHTML = `<div class="tarjeta vacio"><i class="fas fa-inbox"></i><h3>No hay órdenes de producción</h3><p>Crea la primera orden para empezar.</p><a class="btn btn--primario" style="margin-top:16px" href="crear-orden.html"><i class="fas fa-plus"></i> Nueva orden</a></div>`;
                return;
            }
            if (!vis.length) {
                $('lista').innerHTML = `<div class="tarjeta vacio"><i class="fas fa-magnifying-glass"></i><h3>No hay órdenes con ese filtro</h3><button class="btn btn--primario" style="margin-top:16px" data-limpiar>Ver todas las órdenes</button></div>`;
                return;
            }

            // Una sola lista ordenada por fecha de entrega, con separadores sencillos.
            // Un paquete entero va junto, según la entrega más próxima de sus prendas.
            const grupoDe = (dias, lista) => lista ? 'listas' : dias < 0 ? 'vencidas' : dias === 0 ? 'hoy' : dias === 1 ? 'manana' : dias <= 7 ? 'semana' : 'despues';
            const grupos = { vencidas: [], hoy: [], manana: [], semana: [], despues: [], listas: [] };
            const porPaquete = {};
            vis.forEach((x) => {
                if (x.o.paqueteId) (porPaquete[x.o.paqueteId] = porPaquete[x.o.paqueteId] || []).push(x);
                else grupos[grupoDe(x.u.dias, x.r.estado === 'lista')].push({ dias: x.u.dias, num: x.o.numeroOrden, html: fila(x.o) });
            });
            Object.entries(porPaquete).forEach(([id, xs]) => {
                const dias = Math.min(...xs.map((x) => x.u.dias));
                grupos[grupoDe(dias, xs.every((x) => x.r.estado === 'lista'))].push({ dias, num: id, html: bloquePaquete(id, xs.map((x) => x.o)) });
            });
            const info = {
                vencidas: ['Vencidas', 'Ya pasó la fecha de entrega'],
                hoy: ['Se entregan hoy', ''],
                manana: ['Se entregan mañana', ''],
                semana: ['Esta semana', 'En los próximos 7 días'],
                despues: ['Más adelante', ''],
                listas: ['Listas para el historial', 'Terminadas en todas sus áreas'],
            };
            $('lista').innerHTML = Object.entries(grupos).filter(([, l]) => l.length).map(([k, l]) => {
                l.sort((a, b) => a.dias - b.dias || String(a.num).localeCompare(String(b.num), 'es', { numeric: true }));
                const [titulo, sub] = info[k];
                return `<section class="grupo grupo--${k}">
                    <h3 class="grupo__titulo"><span class="grupo__punto"></span>${titulo} <span class="grupo__n">${l.length}</span>${sub ? `<small>${sub}</small>` : ''}</h3>
                    <div class="grupo__lista">${l.map((x) => x.html).join('')}</div>
                </section>`;
            }).join('');
        }

        // ---------- Datos ----------
        async function cargar() {
            const nuevas = await window.DB.obtenerOrdenesONull();
            if (nuevas === null) {
                $('actualizado').innerHTML = '<i class="fas fa-circle" style="color:var(--rojo);font-size:.5rem"></i> Sin conexión, mostrando los últimos datos';
                if (!ordenes.length) { ordenes = JSON.parse(localStorage.getItem('ordenes') || '[]'); pintar(); }
                return;
            }
            $('actualizado').innerHTML = `<i class="fas fa-circle" style="color:var(--verde-2);font-size:.5rem"></i> En vivo · ${new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}`;
            const cambio = JSON.stringify(nuevas) !== JSON.stringify(ordenes);
            ordenes = nuevas;
            localStorage.setItem('ordenes', JSON.stringify(ordenes));
            if (cambio || $('lista').querySelector('.cargando')) pintar();
        }
        // ---------- Gráficas ----------
        let historialG = null;          // null = aún no se ha leído / sin conexión
        let firmaG = '';
        // Pestañas: "Órdenes" (por defecto) y "¿Cómo vamos?"
        const LLAVE_TAB = 'dashboard:pestana';
        let verGraficas = false;
        try { verGraficas = localStorage.getItem(LLAVE_TAB) === 'graficas' || location.hash === '#graficas'; } catch (e) {}
        function aplicarPestana() {
            $('gSec').hidden = !verGraficas;
            $('panelOrdenes').hidden = verGraficas;
            $('tabOrdenes').setAttribute('aria-selected', String(!verGraficas));
            $('tabGraficas').setAttribute('aria-selected', String(verGraficas));
        }
        function irPestana(tab) {
            verGraficas = tab === 'graficas';
            try { localStorage.setItem(LLAVE_TAB, tab); } catch (e) {}
            aplicarPestana();
            if (verGraficas) pintarGraficas(true);
        }
        aplicarPestana();
        $('gFecha').textContent = new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
        document.querySelector('.pestanas').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) irPestana(b.dataset.tab); });
        function pintarGraficas(forzar) {
            if (!verGraficas) return;
            const firma = JSON.stringify(ordenes) + '|' + (historialG ? historialG.length : 'x');
            if (!forzar && firma === firmaG) return;
            firmaG = firma;
            REG.graficas.pintar($('graficas'), ordenes, historialG);
            $('graficas').querySelectorAll('.g-ancha .g-col').forEach((svg) => {
                if (!svg.parentElement.classList.contains('g-desliza')) {
                    const w = document.createElement('div'); w.className = 'g-desliza';
                    svg.replaceWith(w); w.appendChild(svg);
                }
            });
        }
        async function cargarHistorialG() {
            // Solo lectura del historial para las gráficas
            if (navigator.onLine === false && historialG !== null) return;
            historialG = (await window.DB.obtenerHistorial()) || [];
            pintarGraficas();
        }

        ordenes = JSON.parse(localStorage.getItem('ordenes') || '[]');
        if (ordenes.length) pintar();
        cargarHistorialG();
        setInterval(cargarHistorialG, 120000);
        cargar();
        setInterval(cargar, 8000);

        $('buscar').addEventListener('input', pintar);
        $('filtroArea').addEventListener('change', pintar);
        // Filtros: botones de la barra, el aviso de "listas" y "Ver todas"
        $('panelOrdenes').addEventListener('click', (e) => {
            const b = e.target.closest('[data-filtro],[data-limpiar]');
            if (!b) return;
            if (b.hasAttribute('data-limpiar')) { filtro = ''; $('buscar').value = ''; $('filtroArea').value = ''; }
            else filtro = filtro === b.dataset.filtro ? '' : b.dataset.filtro;
            pintar();
            $('filtros').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        });

        // ---------- Acciones ----------
        $('lista').addEventListener('click', async (e) => {
            const t = e.target.closest('[data-abrir-paquete],[data-eliminar],[data-historial],[data-historial-paquete]');
            if (!t) return;
            if (t.dataset.historialPaquete) {
                e.stopPropagation();
                paqueteAlHistorial(t.dataset.historialPaquete, t);
            } else if (t.dataset.abrirPaquete) {
                const p = t.closest('.paquete');
                p.classList.toggle('abierto');
                if (p.classList.contains('abierto')) paquetesCerrados.delete(t.dataset.abrirPaquete); else paquetesCerrados.add(t.dataset.abrirPaquete);
            } else if (t.dataset.eliminar) eliminar(t.dataset.eliminar);
            else if (t.dataset.historial) alHistorial(t.dataset.historial, t);
        });

        const imagenesDe = (o) => [o.imagenDiseno, o.imagenMangaDerecha, o.imagenMangaIzquierda, o.imagenFrente, o.imagenEspalda, ...(o.imagenesAdicionales || [])].filter((u) => u && u.includes('supabase'));

        async function eliminar(n) {
            const o = ordenes.find((x) => x.numeroOrden === n);
            const ok = await REG.confirmar({
                titulo: `¿Eliminar la orden ${n}?`,
                texto: `${esc(o?.cliente || '')} · ${esc(o?.tipoPrenda || '')}.<br>Se borra de producción y de las tablets. <b>No se puede deshacer.</b>`,
                si: 'Sí, eliminar', peligro: true, icono: 'trash',
            });
            if (!ok) return;
            // Primero la orden; las imágenes solo si se borró, y solo las que ninguna otra orden usa.
            const r = await window.DB.eliminarOrden(n);
            if (!r.success) return REG.aviso('No se pudo eliminar. Revisa el internet e intenta de nuevo.', 'error', 5000);
            ordenes = ordenes.filter((x) => x.numeroOrden !== n);
            localStorage.setItem('ordenes', JSON.stringify(ordenes));
            if (o) {
                const enUso = new Set(ordenes.flatMap(imagenesDe));
                for (const url of imagenesDe(o)) if (!enUso.has(url)) await window.DB.eliminarImagen(url);
            }
            REG.aviso(`Orden ${n} eliminada`, 'ok');
            pintar();
        }

        async function mover(lista) {
            let bien = 0;
            for (const o of lista) {
                const r = await window.DB.moverAHistorial(o);
                if (r.success) bien++;
            }
            return bien;
        }

        async function alHistorial(n, boton) {
            const o = ordenes.find((x) => x.numeroOrden === n);
            if (!o) return;
            const ok = await REG.confirmar({ titulo: `¿Mover la orden ${n} al historial?`, texto: 'Todas sus áreas están terminadas. Saldrá de producción.', si: 'Sí, mover', icono: 'box-archive' });
            if (!ok) return;
            boton.disabled = true;
            const bien = await mover([o]); cargarHistorialG();
            if (!bien) { boton.disabled = false; return REG.aviso('No se pudo mover al historial. Intenta de nuevo.', 'error', 5000); }
            REG.aviso(`Orden ${n} en el historial`, 'ok');
            await cargar();
            pintar();
        }

        async function paqueteAlHistorial(id, boton) {
            const lista = ordenes.filter((o) => o.paqueteId === id);
            const ok = await REG.confirmar({ titulo: `¿Mover el ${id} al historial?`, texto: `Sus ${lista.length} órdenes están terminadas y saldrán de producción.`, si: 'Sí, mover todo', icono: 'box-archive' });
            if (!ok) return;
            boton.disabled = true;
            const bien = await mover(lista); cargarHistorialG();
            if (bien < lista.length) REG.aviso(`Se movieron ${bien} de ${lista.length}. Vuelve a intentar con las que faltan.`, 'alerta', 6000);
            else REG.aviso(`${id} en el historial`, 'ok');
            await cargar();
            pintar();
        }

        // ---------- Historial ----------
        $('btnHistorial').addEventListener('click', abrirHistorial);
        async function abrirHistorial() {
            const fondo = document.createElement('div');
            fondo.className = 'modal-fondo';
            fondo.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="hTitulo">
                <div class="modal__cab"><h2 id="hTitulo"><i class="fas fa-clock-rotate-left" style="color:var(--azul-700)"></i> Historial de producción</h2>
                    <button class="btn btn--suave btn--icono" data-cerrar aria-label="Cerrar"><i class="fas fa-xmark"></i></button></div>
                <div class="modal__cuerpo"><div class="cargando"><span></span></div></div>
            </div>`;
            document.body.appendChild(fondo);
            const cerrar = () => fondo.remove();
            fondo.addEventListener('click', (e) => { if (e.target === fondo || e.target.closest('[data-cerrar]')) cerrar(); });

            const data = await window.DB.obtenerHistorial();
            const historial = (data || []).map((h) => ({ ...h.datos_completos, fechaCompletado: h.fecha_completado }));
            localStorage.setItem('historialOrdenes', JSON.stringify(historial));
            const cuerpo = fondo.querySelector('.modal__cuerpo');
            if (!historial.length) {
                cuerpo.innerHTML = `<div class="vacio"><i class="fas fa-inbox"></i><h3>El historial está vacío</h3><p>Aquí aparecen las órdenes que terminaron todas sus áreas.</p></div>`;
                return;
            }
            const esteMes = historial.filter((o) => { const f = new Date(o.fechaCompletado); const h = new Date(); return f.getMonth() === h.getMonth() && f.getFullYear() === h.getFullYear(); });
            cuerpo.innerHTML = `
                <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
                    <span class="chip chip--verde">${historial.length} completadas · ${esteMes.length} este mes</span>
                    <select id="hMes" aria-label="Mes del reporte" style="margin-left:auto;height:36px;border:1.5px solid var(--borde-2);border-radius:10px;padding:0 10px;background:#fff;font-weight:600">
                        ${mesesDelHistorial(historial).map((m) => `<option value="${m.anio}-${m.mes}">${MESES_REPORTE[m.mes][0].toUpperCase() + MESES_REPORTE[m.mes].slice(1)} ${m.anio} · ${m.n}</option>`).join('')}
                    </select>
                    <button class="btn btn--exito btn--chico" id="hPDF"><i class="fas fa-file-pdf"></i> Reporte PDF</button>
                    <button class="btn btn--suave btn--chico" id="hLimpiar"><i class="fas fa-trash" style="color:var(--rojo)"></i> Limpiar historial</button>
                </div>
                <label class="buscar" style="display:block;position:relative;margin-bottom:6px"><i class="fas fa-magnifying-glass" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gris)"></i>
                    <input type="search" id="hBuscar" placeholder="Buscar en el historial" style="width:100%;height:42px;border:1.5px solid var(--borde-2);border-radius:11px;padding:0 14px 0 40px"></label>
                <div id="hLista"></div>`;
            const pintarH = () => {
                const q = cuerpo.querySelector('#hBuscar').value.trim().toLowerCase();
                const vis = historial.filter((o) => !q || `${o.numeroOrden} ${o.cliente} ${o.tipoPrenda}`.toLowerCase().includes(q));
                cuerpo.querySelector('#hLista').innerHTML = vis.map((o) => `
                    <div class="hist-item">
                        ${o.imagenDiseno ? `<img class="mini" src="${esc(o.imagenDiseno)}" alt="" loading="lazy">` : '<div class="mini mini--vacia"><i class="fas fa-shirt"></i></div>'}
                        <div style="flex:1;min-width:0">
                            <b style="color:var(--azul-700)">${esc(o.numeroOrden)}</b> · <b>${esc(o.cliente)}</b>
                            <div class="fila__meta"><span class="chip">${esc(o.tipoPrenda)}</span><span class="chip chip--verde">${totalOrden(o)} uds</span><span class="chip"><i class="fas fa-calendar-check"></i> ${new Date(o.fechaCompletado).toLocaleDateString('es-CO')}</span>${o.paqueteId ? `<span class="chip chip--rosa">${esc(o.paqueteId)}</span>` : ''}</div>
                        </div>
                        <a class="btn btn--borde btn--chico" href="ver-orden.html?orden=${encodeURIComponent(o.numeroOrden)}&origen=historial"><i class="fas fa-eye"></i> Ver</a>
                    </div>`).join('') || '<p class="muted" style="padding:14px 0">Nada coincide.</p>';
            };
            pintarH();
            cuerpo.querySelector('#hBuscar').addEventListener('input', pintarH);
            cuerpo.querySelector('#hPDF').addEventListener('click', async (e) => {
                const [anio, mes] = cuerpo.querySelector('#hMes').value.split('-').map(Number);
                const b = e.currentTarget; b.disabled = true;
                await generarReporteMensualPDF(historial, { anio, mes });
                b.disabled = false;
            });
            cuerpo.querySelector('#hLimpiar').addEventListener('click', async () => {
                const ok = await REG.confirmar({ titulo: '¿Limpiar todo el historial?', texto: `Se borran para siempre las <b>${historial.length}</b> órdenes completadas y sus imágenes. Descarga antes el reporte si lo necesitas.`, si: 'Sí, limpiar', peligro: true, icono: 'trash' });
                if (!ok) return;
                const r = await window.DB.limpiarHistorial();
                if (!r.success) return REG.aviso('No se pudo limpiar el historial.', 'error');
                const enUso = new Set(ordenes.flatMap(imagenesDe));
                for (const o of historial) for (const url of imagenesDe(o)) if (!enUso.has(url)) await window.DB.eliminarImagen(url);
                localStorage.removeItem('historialOrdenes');
                REG.aviso('Historial limpiado', 'ok');
                cerrar();
            });
        }

        // ---------- Nuevo paquete ----------
        $('btnPaquete').addEventListener('click', abrirPaquete);
        if (location.hash === '#paquete') { history.replaceState(null, '', location.pathname); setTimeout(abrirPaquete, 50); }
        if (location.hash === '#historial') { history.replaceState(null, '', location.pathname); setTimeout(abrirHistorial, 50); }

        async function siguientePaquete() {
            const { data } = await supabaseClient.from('ordenes').select('paquete_id');
            const usados = new Set([...(data || []).map((r) => r.paquete_id), ...JSON.parse(localStorage.getItem('historialOrdenes') || '[]').map((o) => o.paqueteId)].filter(Boolean));
            let n = 1;
            while (usados.has(`PKG-${String(n).padStart(3, '0')}`)) n++;
            return `PKG-${String(n).padStart(3, '0')}`;
        }

        async function abrirPaquete() {
            const paqueteId = await siguientePaquete();
            const fondo = document.createElement('div');
            fondo.className = 'modal-fondo';
            fondo.innerHTML = `<form class="modal" style="max-width:980px" novalidate>
                <div class="modal__cab" style="background:linear-gradient(135deg,#880E4F,var(--rosa));color:#fff;border:0">
                    <h2><i class="fas fa-layer-group"></i> Nuevo paquete de uniforme <span class="chip" style="background:rgba(255,255,255,.2);color:#fff">${paqueteId}</span></h2>
                    <button type="button" class="btn btn--claro btn--icono" data-cerrar aria-label="Cerrar"><i class="fas fa-xmark"></i></button>
                </div>
                <div class="modal__cuerpo">
                    <p class="seccion-titulo" style="margin-top:0">Datos del pedido</p>
                    <div class="rejilla rejilla--4">
                        <div class="campo" style="grid-column:span 2"><label for="pCliente">Cliente <span class="obl">*</span></label><input id="pCliente" placeholder="Nombre del cliente o empresa"></div>
                        <div class="campo" style="grid-column:span 2"><label for="pArte">Arte / diseño</label><input id="pArte" placeholder="Nombre del diseño"></div>
                        <div class="campo"><label for="pPedido">Fecha del pedido <span class="obl">*</span></label><input type="date" id="pPedido" value="${REG.hoyISO()}"></div>
                        <div class="campo"><label for="pEntrega" style="color:var(--rojo)">Fecha de entrega <span class="obl">*</span></label><input type="date" id="pEntrega" min="${REG.hoyISO()}"></div>
                    </div>
                    <p class="seccion-titulo">Prendas del uniforme</p>
                    <div id="pPrendas"></div>
                    <button type="button" class="btn btn--borde btn--bloque" id="pMas" style="border-style:dashed;color:var(--rosa);border-color:#E7A7C3"><i class="fas fa-plus"></i> Agregar otra prenda</button>
                </div>
                <div class="modal__pie">
                    <span class="muted" id="pResumen" style="margin-right:auto;align-self:center"></span>
                    <button type="button" class="btn btn--suave" data-cerrar>Cancelar</button>
                    <button type="submit" class="btn btn--rosa" id="pCrear"><i class="fas fa-floppy-disk"></i> Crear paquete</button>
                </div>
            </form>`;
            document.body.appendChild(fondo);
            const form = fondo.querySelector('form');
            const prendas = [];
            const resumen = () => {
                const total = prendas.reduce((s, p) => s + p.f.total(), 0);
                fondo.querySelector('#pResumen').textContent = `${prendas.length} ${prendas.length === 1 ? 'prenda' : 'prendas'} · ${total} unidades`;
            };
            function agregar() {
                const caja = document.createElement('div');
                caja.className = 'prenda-pkg';
                caja.innerHTML = `<div class="prenda-pkg__cab"><span>Prenda ${prendas.length + 1}</span><button type="button" class="btn btn--suave btn--chico" data-quitar><i class="fas fa-trash"></i> Quitar</button></div><div class="prenda-pkg__cuerpo"></div>`;
                fondo.querySelector('#pPrendas').appendChild(caja);
                const item = { caja, f: REG.formularioPrenda(caja.querySelector('.prenda-pkg__cuerpo'), { general: true, alCambiar: resumen }) };
                prendas.push(item);
                caja.querySelector('[data-quitar]').addEventListener('click', () => {
                    if (prendas.length === 1) return REG.aviso('El paquete necesita al menos una prenda.', 'alerta');
                    prendas.splice(prendas.indexOf(item), 1);
                    caja.remove();
                    prendas.forEach((p, i) => (p.caja.querySelector('.prenda-pkg__cab span').textContent = `Prenda ${i + 1}`));
                    resumen();
                });
                resumen();
            }
            agregar();
            fondo.querySelector('#pMas').addEventListener('click', agregar);
            const cerrar = async () => {
                const algo = fondo.querySelector('#pCliente').value || prendas.some((p) => p.f.total() > 0);
                if (algo && !(await REG.confirmar({ titulo: '¿Descartar el paquete?', texto: 'Se perderá lo que escribiste.', si: 'Descartar', peligro: true }))) return;
                fondo.remove();
            };
            fondo.addEventListener('click', (e) => { if (e.target.closest('[data-cerrar]')) cerrar(); });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const cliente = fondo.querySelector('#pCliente').value.trim();
                const arte = fondo.querySelector('#pArte').value.trim();
                const fechaPedido = fondo.querySelector('#pPedido').value;
                const fechaEntrega = fondo.querySelector('#pEntrega').value;
                if (!cliente || !fechaPedido || !fechaEntrega) return REG.aviso('Completa el cliente y las dos fechas.', 'alerta');
                for (let i = 0; i < prendas.length; i++) {
                    const p = prendas[i].f.validar();
                    if (p) return REG.aviso(`Prenda ${i + 1}: ${p}`, 'alerta');
                }
                const boton = fondo.querySelector('#pCrear');
                boton.disabled = true;
                boton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creando…';
                const primero = parseInt(await window.DB.obtenerSiguienteNumeroOrden());
                if (!primero) {
                    boton.disabled = false;
                    boton.innerHTML = '<i class="fas fa-floppy-disk"></i> Crear paquete';
                    return REG.aviso('No hay conexión con el servidor. Intenta de nuevo.', 'error', 5000);
                }
                const creadas = [];
                const fallidas = [];
                for (let i = 0; i < prendas.length; i++) {
                    const d = prendas[i].f.leer();
                    const orden = {
                        numeroOrden: String(primero + i).padStart(3, '0'),
                        cliente, arte, fechaPedido, fechaEntrega,
                        ...d,
                        // Igual que antes: en el paquete solo se guardan las tallas con cantidad
                        tallas: Object.fromEntries(Object.entries(d.tallas).filter(([, v]) => v > 0)),
                        paqueteId,
                        descripcionPedido: `Parte de ${paqueteId}`,
                        observaciones: d.observaciones || `Paquete ${paqueteId} — ${prendas.length} prendas`,
                        fechaCreacion: new Date().toISOString(),
                        estado: { corte: 'pendiente', confeccion: 'pendiente', impresion: 'pendiente', sublimacion: 'pendiente', despacho: 'pendiente' },
                    };
                    const r = await window.DB.crearOrden(orden);
                    if (r.success) creadas.push(orden.numeroOrden);
                    else fallidas.push({ i, orden, error: r.error });
                }
                if (fallidas.length) {
                    boton.disabled = false;
                    boton.innerHTML = '<i class="fas fa-floppy-disk"></i> Reintentar las que faltan';
                    // Las que sí se crearon se quitan del formulario para no duplicarlas al reintentar
                    const fallidasIdx = new Set(fallidas.map((f) => f.i));
                    prendas.filter((_, i) => !fallidasIdx.has(i)).forEach((p) => p.caja.remove());
                    for (let i = prendas.length - 1; i >= 0; i--) if (!fallidasIdx.has(i)) prendas.splice(i, 1);
                    REG.aviso(`Se crearon ${creadas.length} órdenes. ${fallidas.length} no se pudieron guardar: ${fallidas[0].error || 'sin conexión'}.`, 'error', 8000);
                    await cargar();
                    return;
                }
                fondo.remove();
                REG.aviso(`${paqueteId} creado con ${creadas.length} órdenes (${creadas.join(', ')})`, 'ok', 5000);

                await cargar();
                pintar();
            });
        }
    </script>
</body>
</html>
